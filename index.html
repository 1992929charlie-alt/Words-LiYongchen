let _qMediaMap = {};

function resetBankSelection() {
  bankSelected.clear();
  bankSelectAll = false;
}

function openBank() {
  bankState = { view: 'chapters', chapterId: null, subId: null };
  resetBankSelection();
  renderBank();
  openModal('bank-modal');
}

function bankManageBarHTML(showMove) {
  return `<div class="lib-manage-bar">
    <button class="mini-btn" id="bank-select-all-btn" onclick="bankToggleSelectAll()">全选</button>
    ${showMove ? `<button class="mini-btn" id="bank-move-btn" onclick="bankMoveSelected()" disabled>移动选中</button>` : ''}
    <button class="mini-btn danger" id="bank-delete-btn" onclick="bankDeleteSelected()" disabled>删除选中</button>
  </div>`;
}

function renderBank() {
  const body = document.getElementById('bank-body');
  const title = document.getElementById('bank-title');
  const action = document.getElementById('bank-header-action');
  const v = bankState.view;

  if (v === 'chapters') {
    title.textContent = '我的题库';
    action.innerHTML = `<button class="modal-hbtn" onclick="addBankChapter()">＋ 章节</button>`;
    if (!(state.bankChapters || []).length) {
      body.innerHTML = `<div class="empty-tip">
        题库还是空的<br>
        点击右上角「＋ 章节」创建第一个章节吧<br>
        <span style="font-size:12px;opacity:.7">测试时会自动混合题库题目与智能生成的题目</span>
      </div>`;
      return;
    }
    body.innerHTML = '<div class="lib-tip">💡 单击进入章节 · 可勾选批量删除</div>' +
      bankManageBarHTML(false) +
      state.bankChapters.map(c => {
        const total = (c.subchapters || []).reduce((s, x) => s + x.questions.length, 0);
        return `
        <div class="lib-item" data-bank-open-chapter="${c.id}" data-bank-ctx-chapter="${c.id}" data-bank-select-id="${c.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc(c.name)}</div>
            <div class="lib-item-sub">${(c.subchapters || []).length} 个子章节 · ${total} 道题</div>
          </div>
        </div>`;
      }).join('');
  }
  else if (v === 'subs') {
    const c = findBankChapter(bankState.chapterId);
    if (!c) { bankState.view = 'chapters'; return renderBank(); }
    title.textContent = c.name;
    action.innerHTML = `<button class="modal-hbtn" onclick="addBankSub()">＋ 子章节</button>`;
    body.innerHTML =
      `<div class="lib-item" data-bank-back="1">
        <div class="lib-item-main"><div class="lib-item-title">← 返回章节列表</div></div>
      </div>
      <div class="lib-tip">💡 单击进入子章节 · 可勾选批量移动或删除</div>` +
      bankManageBarHTML(true) +
      ((c.subchapters || []).length ? c.subchapters.map(s => `
        <div class="lib-item" data-bank-open-sub="${s.id}" data-bank-chapter-id="${c.id}"
             data-bank-ctx-sub="${s.id}" data-bank-select-id="${s.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc(s.name)}</div>
            <div class="lib-item-sub">${s.questions.length} 道题</div>
          </div>
        </div>`).join('') : '<div class="empty-tip">还没有子章节</div>');
  }
  else {
    const s = findBankSub(bankState.chapterId, bankState.subId);
    if (!s) { bankState.view = 'subs'; return renderBank(); }
    title.textContent = s.name;
    action.innerHTML = `<button class="modal-hbtn" onclick="addQuestion()">＋ 添加</button>`;
    body.innerHTML =
      `<div class="lib-item" data-bank-back="1">
        <div class="lib-item-main"><div class="lib-item-title">← 返回子章节列表</div></div>
      </div>
      <div class="lib-tip">💡 单击编辑 · 可勾选批量移动或删除</div>` +
      bankManageBarHTML(true) +
      (s.questions.length ? s.questions.map(q => `
        <div class="lib-item" data-bank-open-q="${q.id}" data-bank-chapter-id="${bankState.chapterId}"
             data-bank-sub-id="${bankState.subId}" data-bank-ctx-q="${q.id}" data-bank-select-id="${q.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc((q.stem || '').replace(/\[\[(.+?)\]\]/g, '____'))}</div>
            <div class="lib-item-sub">
              ${q.type === 'choice' ? '选择题 · ' + (q.options || []).length + ' 个选项' : '填空题' + (parseBlanks(q.stem).length ? ' · ' + parseBlanks(q.stem).length + ' 个空' : '')}
              ${hasQMedia(q) ? ' · 📎' : ''}
            </div>
          </div>
        </div>`).join('') : '<div class="empty-tip">这个子章节还没有题目</div>');
  }

  updateBankSelectionUI();
  updateBankManageButtons();
}

function updateBankSelectionUI() {
  document.querySelectorAll('#bank-body .lib-item[data-bank-select-id]').forEach(el => {
    if (bankSelected.has(el.dataset.bankSelectId)) el.classList.add('selected');
    else el.classList.remove('selected');
  });
}

function updateBankManageButtons() {
  const selectAllBtn = document.getElementById('bank-select-all-btn');
  const delBtn = document.getElementById('bank-delete-btn');
  const mvBtn = document.getElementById('bank-move-btn');
  if (!selectAllBtn || !delBtn) return;
  selectAllBtn.textContent = bankSelectAll ? '取消全选' : '全选';
  const n = bankSelected.size;
  delBtn.textContent = n > 0 ? `删除选中 (${n})` : '删除选中';
  delBtn.disabled = n === 0;
  if (mvBtn) {
    mvBtn.textContent = n > 0 ? `移动选中 (${n})` : '移动选中';
    mvBtn.disabled = n === 0;
  }
}

function bankCurrentViewIds() {
  const v = bankState.view;
  if (v === 'chapters') return (state.bankChapters || []).map(c => c.id);
  if (v === 'subs') {
    const c = findBankChapter(bankState.chapterId);
    return c ? (c.subchapters || []).map(s => s.id) : [];
  }
  const s = findBankSub(bankState.chapterId, bankState.subId);
  return s ? s.questions.map(q => q.id) : [];
}

function bankToggleSelectAll() {
  const all = bankCurrentViewIds();
  if (bankSelectAll) { bankSelected.clear(); bankSelectAll = false; }
  else { bankSelected = new Set(all); bankSelectAll = true; }
  updateBankSelectionUI();
  updateBankManageButtons();
}

function bankDeleteSelected() {
  if (!bankSelected.size) return;
  const v = bankState.view;
  const ids = Array.from(bankSelected);
  let msg = '';
  if (v === 'chapters') msg = `确定删除选中的 ${ids.length} 个题库章节吗？其中的所有子章节和题目都会被移除。`;
  else if (v === 'subs') msg = `确定删除选中的 ${ids.length} 个子章节吗？其中的所有题目都会被移除。`;
  else msg = `确定删除选中的 ${ids.length} 道题目吗？`;
  if (!confirm(msg)) return;

  if (v === 'chapters') {
    (state.bankChapters || []).forEach(c => {
      if (bankSelected.has(c.id)) (c.subchapters || []).forEach(s => s.questions.forEach(cleanupQuestionMedia));
    });
    state.bankChapters = (state.bankChapters || []).filter(c => !bankSelected.has(c.id));
  } else if (v === 'subs') {
    const c = findBankChapter(bankState.chapterId);
    if (c) {
      (c.subchapters || []).forEach(s => {
        if (bankSelected.has(s.id)) s.questions.forEach(cleanupQuestionMedia);
      });
      c.subchapters = (c.subchapters || []).filter(s => !bankSelected.has(s.id));
    }
  } else {
    const s = findBankSub(bankState.chapterId, bankState.subId);
    if (s) {
      s.questions.forEach(q => { if (bankSelected.has(q.id)) cleanupQuestionMedia(q); });
      s.questions = s.questions.filter(q => !bankSelected.has(q.id));
    }
  }

  resetBankSelection();
  saveState();
  renderBank();
  renderHome();
  toast('已删除选中项');
}

function bankBack() {
  resetBankSelection();
  if (bankState.view === 'questions') { bankState.view = 'subs'; bankState.subId = null; }
  else if (bankState.view === 'subs') { bankState.view = 'chapters'; bankState.chapterId = null; }
  renderBank();
}

/* ---------- 题库章节增删改 ---------- */
function addBankChapter() {
  const name = prompt('请输入题库章节名称：', '章节 ' + ((state.bankChapters || []).length + 1));
  if (name === null) return;
  const t = name.trim();
  if (!t) return toast('名称不能为空');
  if (!Array.isArray(state.bankChapters)) state.bankChapters = [];
  state.bankChapters.push(newBankChapter(t));
  saveState();
  renderBank();
  renderHome();
  toast('章节已创建');
}

function addBankSub() {
  const c = findBankChapter(bankState.chapterId);
  if (!c) return;
  const name = prompt('请输入子章节名称：', '子章节 ' + ((c.subchapters || []).length + 1));
  if (name === null) return;
  const t = name.trim();
  if (!t) return toast('名称不能为空');
  if (!Array.isArray(c.subchapters)) c.subchapters = [];
  c.subchapters.push({ id: uid(), name: t, questions: [] });
  saveState();
  renderBank();
  toast('子章节已创建');
}

function renameBankChapter(chapterId) {
  const c = findBankChapter(chapterId);
  if (!c) return;
  const name = prompt('修改章节名称：', c.name);
  if (name === null) return;
  const t = name.trim();
  if (!t) return;
  c.name = t;
  saveState(); renderBank();
  toast('已重命名');
}

function renameBankSub(chapterId, subId) {
  const s = findBankSub(chapterId, subId);
  if (!s) return;
  const name = prompt('修改子章节名称：', s.name);
  if (name === null) return;
  const t = name.trim();
  if (!t) return;
  s.name = t;
  saveState(); renderBank();
  toast('已重命名');
}

function deleteBankChapter(chapterId) {
  const c = findBankChapter(chapterId);
  if (!c) return;
  if (!confirm('确定删除这个题库章节吗？其中的所有内容都会被移除。')) return;
  (c.subchapters || []).forEach(s => s.questions.forEach(cleanupQuestionMedia));
  state.bankChapters = (state.bankChapters || []).filter(x => x.id !== chapterId);
  saveState(); renderBank(); renderHome();
  toast('已删除');
}

function deleteBankSub(chapterId, subId) {
  const c = findBankChapter(chapterId);
  if (!c) return;
  if (!confirm('确定删除这个子章节吗？')) return;
  const s = (c.subchapters || []).find(x => x.id === subId);
  if (s) s.questions.forEach(cleanupQuestionMedia);
  c.subchapters = (c.subchapters || []).filter(x => x.id !== subId);
  saveState(); renderBank(); renderHome();
  toast('已删除');
}

/* ---------- 题库移动 ---------- */
let bankMoveCtx = null;

function bankMoveSelected() {
  const v = bankState.view;
  if (v === 'chapters') return toast('章节本身不支持移动，可删除后重建');
  const ids = Array.from(bankSelected);
  if (!ids.length) return toast('请先勾选要移动的内容');

  let options = [];
  if (v === 'questions') {
    (state.bankChapters || []).forEach(c => (c.subchapters || []).forEach(s => {
      options.push({ value: c.id + '|' + s.id, label: `${c.name} · ${s.name}` });
    }));
  } else {
    (state.bankChapters || []).forEach(c => options.push({ value: c.id, label: c.name }));
  }
  if (!options.length) return toast('没有可用的目标位置');

  bankMoveCtx = { kind: v, ids };
  document.getElementById('move-title').textContent = v === 'questions' ? '移动题目到…' : '移动子章节到…';
  document.getElementById('move-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">目标位置</label>
      <select class="form-select" id="mv-target">
        ${options.map(o => `<option value="${o.value}">${esc(o.label)}</option>`).join('')}
      </select>
    </div>
    <div class="lib-tip">共 ${ids.length} 项将被移动</div>
  `;
  openModal('move-modal');
}

function confirmBankMove() {
  const target = document.getElementById('mv-target').value;
  const { kind, ids } = bankMoveCtx;

  if (kind === 'questions') {
    const [cId, sId] = target.split('|');
    const dest = findBankSub(cId, sId);
    const src = findBankSub(bankState.chapterId, bankState.subId);
    if (!dest || !src) return;
    const moving = src.questions.filter(q => ids.includes(q.id));
    src.questions = src.questions.filter(q => !ids.includes(q.id));
    dest.questions.push(...moving);
  } else {
    const destC = findBankChapter(target);
    const srcC = findBankChapter(bankState.chapterId);
    if (!destC || !srcC) return;
    if (!Array.isArray(destC.subchapters)) destC.subchapters = [];
    const moving = (srcC.subchapters || []).filter(s => ids.includes(s.id));
    srcC.subchapters = (srcC.subchapters || []).filter(s => !ids.includes(s.id));
    destC.subchapters.push(...moving);
  }

  saveState();
  closeModal('move-modal');
  resetBankSelection();
  renderBank();
  renderHome();
  toast('移动完成');
  bankMoveCtx = null;
}

/* ---------- 题库事件委托 ---------- */
function bindBankEvents() {
  const body = document.getElementById('bank-body');
  if (body._bound) return;
  body._bound = true;

  body.addEventListener('click', e => {
    const target = e.target;
    if (target.closest('[data-bank-back]')) { bankBack(); return; }

    const openC = target.closest('[data-bank-open-chapter]');
    if (openC) {
      resetBankSelection();
      bankState.view = 'subs';
      bankState.chapterId = openC.dataset.bankOpenChapter;
      bankState.subId = null;
      renderBank();
      return;
    }
    const openS = target.closest('[data-bank-open-sub]');
    if (openS) {
      resetBankSelection();
      bankState.view = 'questions';
      bankState.chapterId = openS.dataset.bankChapterId;
      bankState.subId = openS.dataset.bankOpenSub;
      renderBank();
      return;
    }
    const openQ = target.closest('[data-bank-open-q]');
    if (openQ) {
      bankState.chapterId = openQ.dataset.bankChapterId;
      bankState.subId = openQ.dataset.bankSubId;
      editQuestion(openQ.dataset.bankOpenQ);
      return;
    }

    const item = target.closest('.lib-item[data-bank-select-id]');
    if (item) {
      const id = item.dataset.bankSelectId;
      if (bankSelected.has(id)) bankSelected.delete(id);
      else bankSelected.add(id);
      bankSelectAll = bankSelected.size === bankCurrentViewIds().length && bankSelected.size > 0;
      updateBankSelectionUI();
      updateBankManageButtons();
    }
  });

  body.addEventListener('contextmenu', e => {
    const target = e.target;
    const cEl = target.closest('[data-bank-ctx-chapter]');
    if (cEl) {
      e.preventDefault();
      const cid = cEl.dataset.bankCtxChapter;
      showContextMenu(e.clientX, e.clientY, [
        { label: '✏️ 重命名', onClick: () => renameBankChapter(cid) },
        { sep: true },
        { label: '🗑 删除章节', danger: true, onClick: () => deleteBankChapter(cid) }
      ]);
      return;
    }
    const sEl = target.closest('[data-bank-ctx-sub]');
    if (sEl) {
      e.preventDefault();
      const cid = sEl.dataset.bankChapterId, sid = sEl.dataset.bankCtxSub;
      showContextMenu(e.clientX, e.clientY, [
        { label: '✏️ 重命名', onClick: () => renameBankSub(cid, sid) },
        { sep: true },
        { label: '🗑 删除子章节', danger: true, onClick: () => deleteBankSub(cid, sid) }
      ]);
      return;
    }
    const qEl = target.closest('[data-bank-ctx-q]');
    if (qEl) {
      e.preventDefault();
      const cid = qEl.dataset.bankChapterId, sid = qEl.dataset.bankSubId, qid = qEl.dataset.bankCtxQ;
      showContextMenu(e.clientX, e.clientY, [
        { label: '✏️ 编辑题目', onClick: () => { bankState.chapterId = cid; bankState.subId = sid; editQuestion(qid); } },
        { sep: true },
        { label: '🗑 删除题目', danger: true, onClick: () => deleteBankQuestion(cid, sid, qid) }
      ]);
    }
  });
}

function deleteBankQuestion(chapterId, subId, qid) {
  if (!confirm('确定删除这道题吗？')) return;
  const s = findBankSub(chapterId, subId);
  if (!s) return;
  const q = s.questions.find(x => x.id === qid);
  if (q) cleanupQuestionMedia(q);
  s.questions = s.questions.filter(x => x.id !== qid);
  saveState();
  renderBank();
  renderHome();
  toast('已删除');
}

/* ---------- 题目编辑器 ---------- */
function emptyMedia() { return { image: '', audio: '', video: '' }; }

function newQuestionDraft() {
  return {
    id: uid(),
    type: 'choice',
    stem: '',
    stemMedia: emptyMedia(),
    options: [
      { text: '', media: emptyMedia() },
      { text: '', media: emptyMedia() }
    ],
    answerIndex: 0,
    answerText: '',
    explanation: ''
  };
}

function hasQMedia(q) {
  const m = q.stemMedia || {};
  if (m.image || m.audio || m.video) return true;
  return (q.options || []).some(o => o.media && (o.media.image || o.media.audio || o.media.video));
}

function addQuestion() {
  if (!bankState.chapterId || !bankState.subId) {
    // 尝试自动定位第一个可用子章节
    const c = (state.bankChapters || [])[0];
    if (!c) return toast('请先创建一个题库章节');
    const s = (c.subchapters || [])[0];
    if (!s) return toast('请先创建一个子章节');
    bankState.chapterId = c.id;
    bankState.subId = s.id;
  }
  editingQuestion = { mode: 'new', draft: newQuestionDraft() };
  document.getElementById('question-form-title').textContent = '添加习题';
  renderQuestionForm();
  openModal('question-form-modal');
}

function editQuestion(id) {
  const q = findBankQuestion(bankState.chapterId, bankState.subId, id);
  if (!q) return;
  const draft = JSON.parse(JSON.stringify(q));
  draft.stemMedia = draft.stemMedia || emptyMedia();
  draft.options = (draft.options || []).map(o => ({
    text: o.text || '',
    media: o.media || emptyMedia()
  }));
  if (draft.type === 'choice' && draft.options.length < 2) {
    draft.options.push({ text: '', media: emptyMedia() });
  }
  if (!draft.type) draft.type = 'choice';
  if (draft.answerText == null) draft.answerText = '';
  if (draft.explanation == null) draft.explanation = '';
  editingQuestion = { mode: 'edit', draft };
  document.getElementById('question-form-title').textContent = '编辑习题';
  renderQuestionForm();
  openModal('question-form-modal');
}

function mediaEditorHTML(prefix, media) {
  _qMediaMap[prefix] = media;
  return `
    <div class="me-box">
      <div class="me-row">
        <span class="me-ico">🖼</span>
        <input class="me-inp" value="${esc(media.image || '')}" placeholder="图片 URL"
               oninput="updateQMedia('${prefix}','image',this.value)">
        <label class="me-up" for="qfile-${prefix}-image">📁</label>
        <input type="file" id="qfile-${prefix}-image" accept="image/*" hidden
               onchange="uploadQMedia('${prefix}','image',this)">
      </div>
      <div class="me-row">
        <span class="me-ico">🎵</span>
        <input class="me-inp" value="${esc(media.audio || '')}" placeholder="音频 URL"
               oninput="updateQMedia('${prefix}','audio',this.value)">
        <label class="me-up" for="qfile-${prefix}-audio">📁</label>
        <input type="file" id="qfile-${prefix}-audio" accept="audio/*" hidden
               onchange="uploadQMedia('${prefix}','audio',this)">
      </div>
      <div class="me-row">
        <span class="me-ico">🎬</span>
        <input class="me-inp" value="${esc(media.video || '')}" placeholder="视频 URL"
               oninput="updateQMedia('${prefix}','video',this.value)">
        <label class="me-up" for="qfile-${prefix}-video">📁</label>
        <input type="file" id="qfile-${prefix}-video" accept="video/*" hidden
               onchange="uploadQMedia('${prefix}','video',this)">
      </div>
    </div>`;
}

function renderQuestionForm() {
  const d = editingQuestion.draft;
  _qMediaMap = {};
  const body = document.getElementById('question-form-body');
  let h = '';

  h += `<div class="form-group">
    <label class="form-label">题型</label>
    <div class="seg">
      <button class="seg-btn ${d.type === 'choice' ? 'on' : ''}" onclick="setQType('choice')">选择题</button>
      <button class="seg-btn ${d.type === 'fill' ? 'on' : ''}" onclick="setQType('fill')">填空题</button>
    </div>
  </div>`;

  if (d.type === 'fill') {
    h += `<div class="form-group">
      <label class="form-label">题干 *（用 [[答案]] 标记挖空位置）</label>
      <textarea class="form-textarea" id="q-stem-input" style="min-height:90px"
        placeholder="例如：中国的首都是[[北京]]，最大的城市是[[上海]]。"
        oninput="onQStemInput(this.value)">${esc(d.stem)}</textarea>
      <div id="q-blank-info" style="font-size:12px;color:var(--sub);margin-top:8px;line-height:1.9"></div>
    </div>`;
    h += `<div class="form-group">
      <label class="form-label">无标记时的标准答案（选填）</label>
      <input class="form-input" value="${esc(d.answerText)}"
        placeholder="若题干中未使用 [[ ]] 标记，则以此答案为评判标准"
        oninput="editingQuestion.draft.answerText=this.value">
    </div>`;
  } else {
    h += `<div class="form-group">
      <label class="form-label">题干 *</label>
      <textarea class="form-textarea" id="q-stem-input" style="min-height:70px" placeholder="输入题目内容…"
        oninput="editingQuestion.draft.stem=this.value">${esc(d.stem)}</textarea>
    </div>`;
  }

  h += `<div class="form-group">
    <label class="form-label">题干媒体（选填）</label>
    ${mediaEditorHTML('stem', d.stemMedia)}
  </div>`;

  if (d.type === 'choice') {
    h += `<div class="form-group">
      <label class="form-label">选项（点左侧圆点设为正确答案）</label>`;
    d.options.forEach((o, i) => {
      h += `<div class="opt-card">
        <div class="opt-head">
          <button class="opt-mark ${d.answerIndex === i ? 'on' : ''}" onclick="setAnswerIndex(${i})">${d.answerIndex === i ? '✓' : ''}</button>
          <input class="form-input" value="${esc(o.text)}" placeholder="选项 ${i + 1}"
                 oninput="editingQuestion.draft.options[${i}].text=this.value">
          ${d.options.length > 2 ? `<button class="opt-del" onclick="removeOption(${i})">✕</button>` : ''}
        </div>
        ${mediaEditorHTML('opt' + i, o.media)}
      </div>`;
    });
    h += `</div>`;
    if (d.options.length < 8) {
      h += `<button class="mini-btn" style="width:100%;padding:11px;margin-bottom:16px" onclick="addOption()">＋ 添加选项</button>`;
    }
  }

  h += `<div class="form-group">
    <label class="form-label">解析（选填）</label>
    <textarea class="form-textarea" style="min-height:60px" placeholder="答题后展示，可留空"
      oninput="editingQuestion.draft.explanation=this.value">${esc(d.explanation)}</textarea>
  </div>`;

  if (editingQuestion.mode === 'edit') {
    h += `<button class="btn-danger-soft" style="width:100%;padding:14px;border-radius:13px;font-size:15px;font-weight:700;margin-top:6px"
      onclick="deleteQuestionFromForm()">🗑 删除这道题</button>`;
  }

  h += `<div style="font-size:12px;color:var(--sub);line-height:1.7;margin-top:14px;">
    💡 题干与每个选项都可以单独添加图片 / 音频 / 视频，均为选填。<br>
    💡 填空题中，用 <b style="color:var(--primary)">[[答案]]</b> 标记的位置会在答题时变成挖空。
  </div>`;

  body.innerHTML = h;
  if (d.type === 'fill') updateBlankInfo();
}

function onQStemInput(v) {

function updateBlankInfo() {
  const el = document.getElementById('q-blank-info');
  if (!el) return;
  const blanks = parseBlanks(editingQuestion.draft.stem || '');
  if (blanks.length) {
    el.innerHTML = `已检测到 <b style="color:var(--primary)">${blanks.length}</b> 个空：` +

  } else {

function updateQMedia(prefix, key, val) {
  const m = _qMediaMap[prefix];
  if (m) m[key] = val;
}

async function uploadQMedia(prefix, key, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 100 * 1024 * 1024) {
    if (!confirm('文件超过 100MB，可能保存失败，是否继续？')) { input.value = ''; return; }
  }
  try {
    toast('正在保存文件…');
    const id = await saveMedia(file);
    const m = _qMediaMap[prefix];
    if (m) m[key] = 'media:' + id;
    const row = input.parentElement;
    const inp = row ? row.querySelector('.me-inp') : null;
    if (inp) inp.value = 'media:' + id;
    toast('已保存到本地存储');
  } catch (e) {
    console.error(e);
    toast('保存失败：' + e.message);
  }
  input.value = '';
}

function setQType(t) {
  editingQuestion.draft.type = t;
  renderQuestionForm();
}
function addOption() {
  editingQuestion.draft.options.push({ text: '', media: emptyMedia() });
  renderQuestionForm();
}
function removeOption(i) {
  const d = editingQuestion.draft;
  d.options.splice(i, 1);
  if (d.answerIndex >= d.options.length) d.answerIndex = 0;
  renderQuestionForm();
}
function setAnswerIndex(i) {
  editingQuestion.draft.answerIndex = i;
  renderQuestionForm();
}

function saveQuestionForm() {
  const d = editingQuestion.draft;
  if (!d.stem.trim()) return toast('请填写题干');

  if (d.type === 'choice') {
    const validCount = d.options.filter(o =>
      o.text.trim() || o.media.image || o.media.audio || o.media.video).length;
    if (validCount < 2) return toast('至少需要 2 个有内容的选项');
  } else {
    const blanks = parseBlanks(d.stem);
    if (!blanks.length && !d.answerText.trim()) {
      return toast('请用 [[ ]] 标记挖空位置，或填写标准答案');
    }
  }

  const q = {
    id: d.id,
    type: d.type,
    stem: d.stem,
    stemMedia: { ...d.stemMedia },
    options: d.options.map(o => ({ text: o.text.trim(), media: { ...o.media } })),
    answerIndex: Math.min(d.answerIndex, Math.max(0, d.options.length - 1)),
    answerText: d.answerText.trim(),
    explanation: d.explanation.trim()
  };

  const sub = findBankSub(bankState.chapterId, bankState.subId);
  if (!sub) return toast('目标子章节不存在');

  if (editingQuestion.mode === 'new') {
    sub.questions.push(q);
    toast('题目已添加');
  } else {
    const idx = sub.questions.findIndex(x => x.id === q.id);
    if (idx >= 0) sub.questions[idx] = q;
    else sub.questions.push(q);
    toast('已保存');
  }

  saveState();
  closeModal('question-form-modal');
  renderBank();
  renderHome();
}

function deleteQuestionFromForm() {
  const d = editingQuestion.draft;
  const sub = findBankSub(bankState.chapterId, bankState.subId);
  if (!sub) return;
  const q = sub.questions.find(x => x.id === d.id);
  if (q) cleanupQuestionMedia(q);
  sub.questions = sub.questions.filter(x => x.id !== d.id);
  saveState();
  closeModal('question-form-modal');
  renderBank();
  renderHome();
  toast('已删除');
}

function cleanupQuestionMedia(q) {
  if (!q) return;
  const kill = v => {
    if (v && typeof v === 'string' && v.startsWith('media:')) {
      const id = v.slice(6);
      deleteMedia(id);
      if (_mediaUrlCache[id]) { try { URL.revokeObjectURL(_mediaUrlCache[id]); } catch(e){} delete _mediaUrlCache[id]; }
    }
  };
  const sm = q.stemMedia || {};
  kill(sm.image); kill(sm.audio); kill(sm.video);
  (q.options || []).forEach(o => {
    const m = o.media || {};
    kill(m.image); kill(m.audio); kill(m.video);
  });
}

/* =========================================================
   12. 题目构建
   ========================================================= */
function buildAIQuestions(words) {
  const allWords = getAllWords();
  return shuffle(words.slice()).map(w => {
    if (Math.random() < 0.55) {
      const pool = allWords.filter(x => x.id !== w.id && x.th && x.th !== w.th);
      const distractors = shuffle(pool).slice(0, 3);
      if (distractors.length < 2) {
        return {
          kind: 'text',
          label: '拼写题 · 输入对应的中文',
          stem: w.th,
          stemMedia: emptyMedia(),
          answer: (w.zh || '').trim(),
          explanation: `${w.zh} · ${w.py || ''} · ${w.th}`,
          word: w
        };
      }
      const opts = shuffle([w, ...distractors]);
      return {
        kind: 'mcq',
        label: '选择题 · 选择正确的泰语',
        stem: w.zh,
        stemMedia: emptyMedia(),
        options: opts.map(o => ({ text: o.th, media: emptyMedia() })),
        correctIndex: opts.findIndex(o => o.id === w.id),
        explanation: `${w.zh} · ${w.py || ''} · ${w.th}`,
        word: w
      };
    }
    return {
      kind: 'text',
      label: '拼写题 · 输入对应的中文',
      stem: w.th,
      stemMedia: emptyMedia(),
      answer: (w.zh || '').trim(),
      explanation: `${w.zh} · ${w.py || ''} · ${w.th}`,
      word: w
    };
  });
}

function bankToQuizQuestion(q) {
  if (q.type === 'choice') {
    const opts = q.options || [];
    if (opts.length < 2) return null;
    return {
      kind: 'mcq',
      label: '题库 · 选择题',
      stem: q.stem || '',
      stemMedia: q.stemMedia || emptyMedia(),
      options: opts.map(o => ({ text: o.text || '', media: o.media || emptyMedia() })),
      correctIndex: Math.max(0, Math.min(q.answerIndex || 0, opts.length - 1)),
      explanation: q.explanation || '',
      fromBank: true
    };
  }
  const blanks = parseBlanks(q.stem || '');
  if (blanks.length) {
    return {
      kind: 'blanks',
      label: '题库 · 填空题（挖空）',
      stem: q.stem,
      stemMedia: q.stemMedia || emptyMedia(),
      blanks,
      explanation: q.explanation || '',
      fromBank: true
    };
  }
  if (!q.answerText) return null;
  return {
    kind: 'text',
    label: '题库 · 填空题',
    stem: q.stem || '',
    stemMedia: q.stemMedia || emptyMedia(),
    answer: (q.answerText || '').trim(),
    explanation: q.explanation || '',
    fromBank: true
  };
}

function buildQuestions(words) {
  const aiPool = shuffle(buildAIQuestions(words));
  const bankPool = shuffle(
    allBankQuestions().map(bankToQuizQuestion).filter(Boolean)
  );
  const total = Math.min(10, aiPool.length + bankPool.length);
  if (total === 0) return [];

  const half = Math.ceil(total / 2);
  let bankTake = Math.min(bankPool.length, half);
  let aiTake = Math.min(aiPool.length, total - bankTake);
  bankTake = Math.min(bankPool.length, total - aiTake);

  return shuffle(bankPool.slice(0, bankTake).concat(aiPool.slice(0, aiTake)));
}

async function mediaHtml(media) {
  if (!media) return '';
  let h = '';
  if (media.image) {
    const u = await resolveMediaUrl(media.image);
    if (u) h += `<img class="q-media-img" src="${esc(u)}" alt="">`;
  }
  if (media.audio) {
    const u = await resolveMediaUrl(media.audio);
    if (u) h += `<audio class="q-media-audio" src="${esc(u)}" controls preload="metadata"></audio>`;
  }
  if (media.video) {
    const u = await resolveMediaUrl(media.video);
    if (u) h += `<video class="q-media-video" src="${esc(u)}" controls playsinline preload="metadata"></video>`;
  }
  return h;
}

/* =========================================================
   13. 背单词流程

let study = null;
let _studyAudioEl = null;
let _studyAudioSrc = '';

function startStudy() {
  const book = getCurrentBook();
  if (!book) { toast('请先创建并选择词书'); return; }

  const pool = bookWords(book).filter(w => !state.wordStatus[w.id]);

  if (pool.length === 0) {
    toast('当前词书已全部学完，去复习吧！');
    return;
  }

  const batch = shuffle(pool).slice(0, Math.min(10, pool.length));

  study = { words: batch, index: 0, flipped: false, unknown: [] };
  document.getElementById('study-card').classList.remove('flipped');
  document.getElementById('study-actions').classList.remove('hidden');
  document.getElementById('study-next-wrap').classList.add('hidden');

  stopStudyAudio();

  showScreen('study-screen');
  renderStudyCard();
}

function stopStudyAudio() {
  if (_studyAudioEl) {
    try { _studyAudioEl.pause(); } catch (e) {}
    _studyAudioEl = null;
    _studyAudioSrc = '';
  }
  const btn = document.getElementById('speaker-btn');
  if (btn) { btn.textContent = '🔊'; btn.classList.remove('playing'); }
}

let _renderToken = 0;

function renderStudyCard() {
  if (!study) return;
  if (study.index >= study.words.length) {
    startQuiz(study.words, 'study');
    return;
  }

  const w = study.words[study.index];
  study.flipped = false;

  document.getElementById('study-card').classList.remove('flipped');
  document.getElementById('study-actions').classList.remove('hidden');
  document.getElementById('study-next-wrap').classList.add('hidden');
  document.getElementById('front-zh').textContent = w.zh;

  document.getElementById('back-zh').textContent = w.zh;
  document.getElementById('back-py').textContent = w.py || '';
  document.getElementById('back-th').textContent = w.th || '';

  const relEl = document.getElementById('back-rel');
  const relParts = [];
  if (w.syn) relParts.push(`<span class="rel-chip"><b>近</b>${esc(w.syn)}</span>`);
  if (w.ant) relParts.push(`<span class="rel-chip"><b>反</b>${esc(w.ant)}</span>`);
  if (w.near) relParts.push(`<span class="rel-chip"><b>形</b>${esc(w.near)}</span>`);
  if (relParts.length) {
    relEl.innerHTML = relParts.join('');
    relEl.classList.remove('hidden');
  } else {
    relEl.innerHTML = '';
    relEl.classList.add('hidden');
  }

  stopStudyAudio();

  const mediaEl = document.getElementById('back-media');
  mediaEl.innerHTML = '';
  mediaEl.style.display = 'none';
  loadStudyMedia(w);

  const spk = document.getElementById('speaker-btn');
  if (w.audio) {
    spk.classList.remove('hidden');
    spk.textContent = '🔊';
    spk.classList.remove('playing');
  } else {
    spk.classList.add('hidden');
  }

  const exEl = document.getElementById('back-example');
  if (w.example) {
    exEl.textContent = w.example;
    exEl.classList.remove('hidden');
  } else {
    exEl.classList.add('hidden');
  }

  const pct = (study.index / study.words.length) * 100;
  document.getElementById('study-fill').style.width = pct + '%';
  document.getElementById('study-counter').textContent = (study.index + 1) + '/' + study.words.length;
}

async function loadStudyMedia(word) {
  const token = ++_renderToken;
  const mediaEl = document.getElementById('back-media');
  let html = '';
  if (word.image) {
    const url = await resolveMediaUrl(word.image);
    if (url && token === _renderToken) html += `<img src="${esc(url)}" alt="">`;
  }
  if (word.video) {
    const url = await resolveMediaUrl(word.video);
    if (url && token === _renderToken) {
      html += `<video src="${esc(url)}" controls playsinline preload="metadata" controlsList="nodownload"></video>`;
    }
  }
  if (token !== _renderToken) return;
  if (html) {
    mediaEl.innerHTML = html;
    mediaEl.style.display = 'block';
  }
}

function flipCard(e) {
  if (e && e.target && e.target.closest) {
    if (e.target.closest('video') || e.target.closest('audio') || e.target.closest('#speaker-btn')) return;
  }
  document.getElementById('study-card').classList.toggle('flipped');
}

async function toggleCurrentAudio() {
  if (!study) return;
  const w = study.words[study.index];
  if (!w || !w.audio) return;

  const btn = document.getElementById('speaker-btn');
  const url = await resolveMediaUrl(w.audio);
  if (!url) { toast('音频资源不可用'); return; }

  if (_studyAudioEl && _studyAudioSrc === url) {
    if (_studyAudioEl.paused) {
      try {
        await _studyAudioEl.play();
        btn.textContent = '⏸';
        btn.classList.add('playing');
      } catch (err) { toast('无法播放该音频'); }
    } else {
      _studyAudioEl.pause();
      btn.textContent = '🔊';
      btn.classList.remove('playing');
    }
    return;
  }

  if (_studyAudioEl) {
    try { _studyAudioEl.pause(); } catch (e) {}
    _studyAudioEl = null;
  }

  _studyAudioEl = new Audio(url);
  _studyAudioSrc = url;

  _studyAudioEl.onended = () => { btn.textContent = '🔊'; btn.classList.remove('playing'); };
  _studyAudioEl.onpause = () => { btn.textContent = '🔊'; btn.classList.remove('playing'); };
  _studyAudioEl.onplay = () => { btn.textContent = '⏸'; btn.classList.add('playing'); };

  try {
    await _studyAudioEl.play();
    btn.textContent = '⏸';
    btn.classList.add('playing');
  } catch (err) {
    toast('无法播放该音频');
    _studyAudioEl = null;
    _studyAudioSrc = '';
    btn.textContent = '🔊';
    btn.classList.remove('playing');
  }
}

function answerStudy(known) {
  if (!study || study.flipped) return;
  const w = study.words[study.index];

  if (known) {
    state.wordStatus[w.id] = 'learned';
  } else {
    state.wordStatus[w.id] = 'pending';
    study.unknown.push(w);
  }
  saveState();
  renderHome();

  stopStudyAudio();

  study.flipped = true;
  document.getElementById('study-card').classList.add('flipped');
  document.getElementById('study-actions').classList.add('hidden');
  document.getElementById('study-next-wrap').classList.remove('hidden');

  const pct = ((study.index + 1) / study.words.length) * 100;
  document.getElementById('study-fill').style.width = pct + '%';
}

function nextStudyCard() {
  if (!study) return;
  study.index++;
  renderStudyCard();
}

function quitStudy() {
  if (!confirm('确定退出本次学习吗？进度会保留。')) return;
  stopStudyAudio();
  study = null;
  showScreen('home-screen');
  renderHome();
}

/* =========================================================
   14. 测试系统
   ========================================================= */
let quiz = null;
let lastQuizWords = [];
let _quizToken = 0;

function startQuiz(words, mode) {
  lastQuizWords = words.slice();
  const questions = buildQuestions(words);
  if (!questions.length) {
    toast('没有可用的题目，请先添加词汇或题库题目');
    showScreen('home-screen');
    renderHome();
    return;
  }
  quiz = { questions, index: 0, correct: 0, mode, answered: false };
  showScreen('quiz-screen');
  renderQuestion();
}

async function renderQuestion() {
  if (!quiz) return;
  if (quiz.index >= quiz.questions.length) { finishQuiz(); return; }

  const token = ++_quizToken;
  const q = quiz.questions[quiz.index];
  quiz.answered = false;

  document.getElementById('quiz-fill').style.width =
    ((quiz.index) / quiz.questions.length * 100) + '%';
  document.getElementById('quiz-counter').textContent =
    (quiz.index + 1) + '/' + quiz.questions.length;

  const body = document.getElementById('quiz-body');
  const stemMedia = await mediaHtml(q.stemMedia);
  if (token !== _quizToken) return;

  if (q.kind === 'mcq') {
    const optMedias = [];
    for (let i = 0; i < q.options.length; i++) {
      optMedias.push(await mediaHtml(q.options[i].media));
    }
    if (token !== _quizToken) return;

    body.innerHTML = `
      <div class="quiz-q-label">${esc(q.label || '选择题')}</div>
      <div class="quiz-question">${esc(q.stem)}</div>
      ${stemMedia ? `<div class="q-stem-media">${stemMedia}</div>` : ''}
      <div class="quiz-options" id="quiz-options">
        ${q.options.map((o, i) => `
          <button class="quiz-option" data-idx="${i}" onclick="answerMCQ(${i})">
            ${optMedias[i] ? `<div class="q-opt-media" onclick="event.stopPropagation()">${optMedias[i]}</div>` : ''}
            ${o.text ? `<div>${esc(o.text)}</div>` : ''}
          </button>
        `).join('')}
      </div>
      <div id="quiz-feedback"></div>
    `;
  } else if (q.kind === 'blanks') {
    body.innerHTML = `
      <div class="quiz-q-label">${esc(q.label || '填空题')}</div>
      <div class="quiz-question blanks">${stemWithBlanksHTML(q.stem)}</div>
      ${stemMedia ? `<div class="q-stem-media">${stemMedia}</div>` : ''}
      <button class="quiz-submit" onclick="answerBlanks()">提交答案</button>
      <div id="quiz-feedback"></div>
    `;
    setTimeout(() => {
      const el = document.querySelector('#quiz-body .blank-input');
      if (el) el.focus();
    }, 220);
  } else {
    body.innerHTML = `
      <div class="quiz-q-label">${esc(q.label || '填空题')}</div>
      <div class="quiz-question">${esc(q.stem)}</div>
      ${stemMedia ? `<div class="q-stem-media">${stemMedia}</div>` : ''}
      <input class="quiz-spell-input" id="quiz-spell" placeholder="输入答案…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="quiz-submit" onclick="answerSpell()">提交答案</button>
      <div id="quiz-feedback"></div>
    `;
    setTimeout(() => {
      const el = document.getElementById('quiz-spell');
      if (el) {
        el.focus();
        el.addEventListener('keydown', e => { if (e.key === 'Enter') answerSpell(); });
      }
    }, 220);
  }
}

function answerMCQ(idx) {
  if (!quiz || quiz.answered) return;
  quiz.answered = true;
  const q = quiz.questions[quiz.index];
  const isCorrect = idx === q.correctIndex;

  document.querySelectorAll('#quiz-options .quiz-option').forEach(btn => {
    btn.classList.add('locked');
    if (+btn.dataset.idx === q.correctIndex) btn.classList.add('correct');
  });
  if (!isCorrect) {
    const wrongBtn = document.querySelector(`#quiz-options .quiz-option[data-idx="${idx}"]`);
    if (wrongBtn) wrongBtn.classList.add('wrong');
  }

  if (isCorrect) { quiz.correct++; playCorrectSound(); }
  else playWrongSound();

  const correctText = (q.options[q.correctIndex] && q.options[q.correctIndex].text) || '';
  let msg = isCorrect ? '✓ 答对了！' : `✗ 正确答案：${esc(correctText || '（见选项）')}`;
  if (q.explanation) msg += `<div style="font-size:13px;font-weight:500;margin-top:6px;opacity:.85">${esc(q.explanation)}</div>`;

  const fb = document.getElementById('quiz-feedback');
  fb.className = 'quiz-feedback ' + (isCorrect ? 'ok' : 'no');
  fb.innerHTML = msg;

  setTimeout(() => { if (quiz) { quiz.index++; renderQuestion(); } }, 1300);
}

function answerBlanks() {
  if (!quiz || quiz.answered) return;
  const q = quiz.questions[quiz.index];
  const inputs = Array.from(document.querySelectorAll('#quiz-body .blank-input'));
  if (!inputs.length) return;

  const vals = inputs.map(i => i.value.trim());
  if (vals.some(v => !v)) { toast('请填写所有空'); return; }

  quiz.answered = true;
  let allOk = true;
  inputs.forEach((inp, i) => {
    const ok = normText(vals[i]) === normText(q.blanks[i]);
    inp.classList.add(ok ? 'blank-ok' : 'blank-no');
    inp.disabled = true;
    if (!ok) allOk = false;
  });

  if (allOk) { quiz.correct++; playCorrectSound(); }
  else playWrongSound();

  let msg = allOk ? '✓ 完全正确！' : `✗ 正确答案：${q.blanks.map(b => esc(b)).join(' / ')}`;
  if (q.explanation) msg += `<div style="font-size:13px;font-weight:500;margin-top:6px;opacity:.85">${esc(q.explanation)}</div>`;

  const fb = document.getElementById('quiz-feedback');
  fb.className = 'quiz-feedback ' + (allOk ? 'ok' : 'no');
  fb.innerHTML = msg;

  const btn = document.querySelector('.quiz-submit');
  if (btn) btn.disabled = true;

  setTimeout(() => { if (quiz) { quiz.index++; renderQuestion(); } }, 1500);
}

function answerSpell() {
  if (!quiz || quiz.answered) return;
  const input = document.getElementById('quiz-spell');
  if (!input) return;
  const val = input.value.trim();
  if (!val) { toast('请输入答案'); return; }

  quiz.answered = true;
  const q = quiz.questions[quiz.index];
  const isCorrect = normText(val) === normText(q.answer);

  if (isCorrect) { quiz.correct++; playCorrectSound(); }
  else playWrongSound();

  input.disabled = true;
  input.style.borderColor = isCorrect ? 'var(--primary)' : 'var(--danger)';
  input.style.color = isCorrect ? 'var(--primary)' : 'var(--danger)';

  let msg = isCorrect ? '✓ 完全正确！' : `✗ 正确答案：${esc(q.answer)}`;
  if (q.explanation) msg += `<div style="font-size:13px;font-weight:500;margin-top:6px;opacity:.85">${esc(q.explanation)}</div>`;

  const fb = document.getElementById('quiz-feedback');
  fb.className = 'quiz-feedback ' + (isCorrect ? 'ok' : 'no');
  fb.innerHTML = msg;

  const btn = document.querySelector('.quiz-submit');
  if (btn) btn.disabled = true;

  setTimeout(() => { if (quiz) { quiz.index++; renderQuestion(); } }, 1400);
}

function finishQuiz() {
  if (!quiz) return;
  const total = quiz.questions.length;
  const rate = total ? quiz.correct / total : 0;
  const passed = rate >= 0.6;
  const mode = quiz.mode;
  const correct = quiz.correct;

  if (passed) playPassSound();
  else playFailSound();

  quiz = null;
  showResult(passed, rate, correct, total, mode);
}

function showResult(passed, rate, correct, total, mode) {
  const circle = document.getElementById('result-circle');
  const title = document.getElementById('result-title');
  const desc = document.getElementById('result-desc');
  const actions = document.getElementById('result-actions');

  const pct = Math.round(rate * 100);
  circle.className = 'result-circle ' + (passed ? 'ok' : 'no');
  circle.textContent = passed ? '🎉' : '💪';
  title.textContent = passed ? '测试通过！' : '再练一练吧';
  desc.textContent = `答对 ${correct} / ${total} 题（正确率 ${pct}%）`;

  if (passed) {
    actions.innerHTML = `
      <button class="btn-primary" onclick="restAndHome()">休息一会</button>
      <button class="btn-ghost" onclick="continueStudy()">继续背词</button>
    `;
  } else {
    actions.innerHTML = `
      <button class="btn-primary" onclick="retryQuiz()">重新测试</button>
      <button class="btn-ghost" onclick="restAndHome()">返回首页</button>
    `;
  }
  showScreen('result-screen');
}

function retryQuiz() {
  if (!lastQuizWords.length) return restAndHome();
  startQuiz(lastQuizWords, 'review');
}
function restAndHome() { showScreen('home-screen'); renderHome(); }
function continueStudy() { startStudy(); }

function quitQuiz() {
  if (!confirm('确定退出测试吗？')) return;
  quiz = null;
  showScreen('home-screen');
  renderHome();
}

/* =========================================================
   15. 复习
   ========================================================= */
function startReview() {
  const book = getCurrentBook();
  if (!book) { toast('请先创建并选择词书'); return; }

  const pool = bookWords(book).filter(w => state.wordStatus[w.id]);

  if (pool.length < 4) { toast('学过的单词还太少，先去背几个吧'); return; }

  const batch = shuffle(pool).slice(0, Math.min(10, pool.length));
  startQuiz(batch, 'review');
}

/* =========================================================
   16. 备份导入导出
   ========================================================= */
function collectMediaIds(data) {
  const allIds = new Set();
  (data.books || []).forEach(b => (b.chapters || []).forEach(c => (c.subchapters || []).forEach(s => (s.words || []).forEach(w => {
    ['image', 'audio', 'video'].forEach(k => {
      const v = w[k];
      if (v && typeof v === 'string' && v.startsWith('media:')) allIds.add(v.slice(6));
    });
  }))));
  (data.bankChapters || []).forEach(c => (c.subchapters || []).forEach(s => (s.questions || []).forEach(q => {
    const sm = q.stemMedia || {};
    ['image', 'audio', 'video'].forEach(k => {
      const v = sm[k];
      if (v && typeof v === 'string' && v.startsWith('media:')) allIds.add(v.slice(6));
    });
    (q.options || []).forEach(o => {
      const m = o.media || {};
      ['image', 'audio', 'video'].forEach(k => {
        const v = m[k];
        if (v && typeof v === 'string' && v.startsWith('media:')) allIds.add(v.slice(6));
      });
    });
  })));
  return allIds;
}

function stripMediaRefs(data) {
  (data.books || []).forEach(b => (b.chapters || []).forEach(c => (c.subchapters || []).forEach(s => (s.words || []).forEach(w => {
    ['image', 'audio', 'video'].forEach(k => {
      if (w[k] && typeof w[k] === 'string' && w[k].startsWith('media:')) w[k] = '';
    });
  }))));
  (data.bankChapters || []).forEach(c => (c.subchapters || []).forEach(s => (s.questions || []).forEach(q => {
    const sm = q.stemMedia || {};
    ['image', 'audio', 'video'].forEach(k => {
      if (sm[k] && typeof sm[k] === 'string' && sm[k].startsWith('media:')) sm[k] = '';
    });
    (q.options || []).forEach(o => {
      const m = o.media || {};
      ['image', 'audio', 'video'].forEach(k => {
        if (m[k] && typeof m[k] === 'string' && m[k].startsWith('media:')) m[k] = '';
      });
    });
  })));
}

async function exportBackup() {
  const includeMedia = confirm(
    '导出范围：\n\n' +
    '· 点击【确定】导出完整备份（含图片/音频/视频，文件可能较大）\n' +
    '· 点击【取消】仅导出文本（不含媒体文件）'
  );

  try {
    toast('正在准备导出…');
    const exportData = JSON.parse(JSON.stringify(state));
    if (!Array.isArray(exportData.bankChapters)) exportData.bankChapters = [];

    if (includeMedia) {
      const allIds = collectMediaIds(exportData);
      const mediaMap = {};
      let count = 0;
      for (const id of allIds) {
        try {
          const blob = await getMediaBlob(id);
          if (blob) { mediaMap[id] = await blobToDataURL(blob); count++; }
        } catch (e) { console.warn('导出媒体失败', id, e); }
      }
      exportData._media = mediaMap;
      toast(`已打包 ${count} 个媒体文件`);
    } else {
      stripMediaRefs(exportData);
    }

    const blob = new Blob([JSON.stringify(exportData)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0') + '_' +
      String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    a.href = url;
    a.download = 'thai_vocab_backup_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('备份已导出');
  } catch (e) {
    console.error(e);
    toast('导出失败：' + e.message);
  }
}

async function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data || !Array.isArray(data.books)) throw new Error('文件格式不正确');
        migrateState(data);

        if (data._media && typeof data._media === 'object') {
          const ids = Object.keys(data._media);
          if (ids.length) {
            toast(`正在导入 ${ids.length} 个媒体文件…`);
            let ok = 0;
            for (const id of ids) {
              try {
                const blob = dataURLToBlob(data._media[id]);
                await saveMedia(blob, id);
                ok++;
              } catch (err) { console.warn('导入媒体失败', id, err); }
            }
            toast(`媒体导入完成（${ok}/${ids.length}）`);
          }
          delete data._media;
        }

        if (!data.currentBookId || !data.books.find(b => b.id === data.currentBookId)) {
          data.currentBookId = data.books[0] ? data.books[0].id : null;
        }
        state = data;
        saveState();
        renderHome();
        toast('导入成功！');
      } catch (err) {
        console.error(err);
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* =========================================================
   17. 启动
   ========================================================= */
(function boot() {
  let savedTheme = 'green';
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'green'; } catch (e) {}
  if (!THEMES.find(t => t.id === savedTheme)) savedTheme = 'green';
  currentTheme = savedTheme;
  document.documentElement.setAttribute('data-theme', currentTheme);

  loadState();
  renderHome();
  bindLibEvents();
  bindBankEvents();
  buildThemeGrid();

  const initAudioOnce = () => {
    getSfxCtx();
    document.removeEventListener('click', initAudioOnce);
    document.removeEventListener('touchstart', initAudioOnce);
  };
  document.addEventListener('click', initAudioOnce);
  document.addEventListener('touchstart', initAudioOnce);

  let lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // 修补：确认移动时判断是词库还是题库
  const _origConfirmMove = confirmMove;
  window.confirmMove = function () {
    if (bankMoveCtx) return confirmBankMove();
    return _origConfirmMove();
  };
})();
