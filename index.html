<html lang="zh-CN" data-theme="green">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆词汇 · 单词卡片</title>
<script>
try { var _t = localStorage.getItem('thai_vocab_theme'); if (_t) document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
</script>
<style>
:root {
  --primary: #2C8A67;
  --primary-dark: #1F6B4F;
  --primary-light: #E8F5EF;
  --bg: #F5F8F6;
  --card: #FFFFFF;
  --text: #2B2B2B;
  --sub: #8A9490;
  --danger: #E05A5A;
  --danger-light: #FFF0F0;
  --border: #E8EDEB;
  --soft: #EEF4F1;
  --stroke: #BFE3D3;
  --page: #DDE6E1;
  --pattern: rgba(44,138,103,0.055);
  --shadow: 0 8px 28px rgba(44,138,103,0.10);
  --radius: 18px;
}

/* ==================== 主题 ==================== */
html[data-theme="red"] {
  --primary:#E2504C; --primary-dark:#B93A37; --primary-light:#FFEDEC;
  --bg:#FFF8F7; --card:#FFFFFF; --text:#3A2626; --sub:#A08A8A;
  --danger:#D93A3A; --danger-light:#FFEDED; --border:#F7DEDD; --soft:#F8ECEB;
  --stroke:#F6C9C7; --page:#F3D9D8; --pattern:rgba(226,80,76,0.06);
  --shadow:0 8px 28px rgba(226,80,76,0.12);
}
html[data-theme="orange"] {
  --primary:#F08A24; --primary-dark:#C96C12; --primary-light:#FFF1E0;
  --bg:#FFFBF6; --card:#FFFFFF; --text:#3B2C1A; --sub:#A2907A;
  --danger:#E05545; --danger-light:#FFEEEA; --border:#F7E4CB; --soft:#F9EFE2;
  --stroke:#F7DCB4; --page:#F5E2C9; --pattern:rgba(240,138,36,0.07);
  --shadow:0 8px 28px rgba(240,138,36,0.12);
}
html[data-theme="yellow"] {
  --primary:#D9A70E; --primary-dark:#B78C08; --primary-light:#FFF8DC;
  --bg:#FFFDF4; --card:#FFFFFF; --text:#3B3520; --sub:#A39A73;
  --danger:#E05545; --danger-light:#FFEEEA; --border:#F4E9C0; --soft:#F7F1DC;
  --stroke:#F0E0A8; --page:#F5EDC8; --pattern:rgba(217,167,14,0.09);
  --shadow:0 8px 28px rgba(224,176,22,0.14);
}
html[data-theme="green"] {
  --primary:#2C8A67; --primary-dark:#1F6B4F; --primary-light:#E8F5EF;
  --bg:#F5F8F6; --card:#FFFFFF; --text:#2B2B2B; --sub:#8A9490;
  --danger:#E05A5A; --danger-light:#FFF0F0; --border:#E8EDEB; --soft:#EEF4F1;
  --stroke:#BFE3D3; --page:#DDE6E1; --pattern:rgba(44,138,103,0.055);
  --shadow:0 8px 28px rgba(44,138,103,0.10);
}
html[data-theme="blue"] {
  --primary:#3B82C4; --primary-dark:#2A639A; --primary-light:#E8F3FD;
  --bg:#F6FAFE; --card:#FFFFFF; --text:#22303D; --sub:#8095A6;
  --danger:#E05A5A; --danger-light:#FFEEEE; --border:#DCE9F6; --soft:#EAF1F8;
  --stroke:#C2DBF2; --page:#D6E5F3; --pattern:rgba(59,130,196,0.06);
  --shadow:0 8px 28px rgba(59,130,196,0.12);
}
html[data-theme="purple"] {
  --primary:#8B5CC7; --primary-dark:#6C42A3; --primary-light:#F3EBFC;
  --bg:#FBF8FE; --card:#FFFFFF; --text:#2F2439; --sub:#9186A0;
  --danger:#E05A5A; --danger-light:#FFEEEE; --border:#E9DDF6; --soft:#F1EBF8;
  --stroke:#DCC8F2; --page:#E4D8F2; --pattern:rgba(139,92,199,0.06);
  --shadow:0 8px 28px rgba(139,92,199,0.12);
}
html[data-theme="white"] {
  --primary:#5A7A8C; --primary-dark:#41606F; --primary-light:#EEF2F5;
  --bg:#FAFBFC; --card:#FFFFFF; --text:#2B2F33; --sub:#939CA3;
  --danger:#E05A5A; --danger-light:#FFEEEE; --border:#E6EAED; --soft:#F0F2F4;
  --stroke:#DCE2E6; --page:#E4E8EB; --pattern:rgba(90,122,140,0.05);
  --shadow:0 8px 28px rgba(90,122,140,0.10);
}
html[data-theme="black"] {
  --primary:#4CC38A; --primary-dark:#35A26E; --primary-light:#1E2A24;
  --bg:#121614; --card:#1C2320; --text:#E6EFEA; --sub:#8A9A93;
  --danger:#FF6B6B; --danger-light:#2A1A1A; --border:#2A3430; --soft:#1A211E;
  --stroke:#2E3A34; --page:#080A09; --pattern:rgba(76,195,138,0.05);
  --shadow:0 8px 28px rgba(0,0,0,0.40);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--page);
  color: var(--text);
  overflow: hidden;
  transition: background .3s;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; }
input, textarea, select { font-family: inherit; outline: none; }

#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100%;
  max-height: 900px;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.10);
  transition: background .3s;
}
@media (min-width: 500px) {
  body { display: flex; align-items: center; justify-content: center; }
  #app { border-radius: 24px; height: 92vh; }
}

.screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 20px 20px, var(--pattern) 4px, transparent 5px),
    radial-gradient(circle at 60px 60px, var(--pattern) 2.5px, transparent 3.5px);
  background-size: 80px 80px;
  overflow: hidden;
  transition: background-color .3s;
}
.screen.active { display: flex; }

/* ---------- 首页 ---------- */
#home-screen { padding: 0; }
.home-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 18px 0;
  position: relative;
  z-index: 40;
}
.top-btn {
  font-size: 13px; color: var(--primary);
  background: var(--card);
  border: 2px solid var(--primary);
  padding: 6px 12px; border-radius: 20px;
  font-weight: 700;
  box-shadow: 0 3px 0 var(--stroke);
  transition: transform .12s, box-shadow .12s, background .2s;
}
.top-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--stroke); }
.topbar-right { display: flex; gap: 8px; }
.theme-btn.on { background: var(--primary); color: #fff; border-color: var(--primary-dark); }

/* ---------- 主题面板 ---------- */
.theme-pop {
  position: absolute;
  top: 58px; left: 14px;
  width: 246px;
  background: var(--card);
  border: 2.5px solid var(--stroke);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--stroke), 0 16px 34px rgba(0,0,0,0.16);
  padding: 12px;
  display: none;
  z-index: 300;
  animation: popIn .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes popIn { from { opacity: 0; transform: scale(.9) translateY(-6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.theme-pop.active { display: block; }
.tp-title { font-size: 12px; font-weight: 800; color: var(--sub); margin-bottom: 10px; letter-spacing: .5px; }
.tp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tp-item {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 7px 2px 6px; border-radius: 12px;
  font-size: 11px; font-weight: 800; color: var(--sub);
  border: 2px solid transparent;
  transition: all .15s;
}
.tp-item:active { transform: scale(.94); }
.tp-dot {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.12);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 900;
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.12);
}
.tp-item.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }

.home-body {
  flex: 1;
  padding: 22px 22px 30px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.home-title {
  font-size: 30px; font-weight: 800; color: var(--primary);
  letter-spacing: 1px;
  text-shadow: 0 2px 0 var(--stroke);
}
.home-sub {
  font-size: 13px; color: var(--sub); margin-top: 6px; margin-bottom: 26px;
}

.current-book-card {
  background: var(--card);
  border: 2.5px solid var(--stroke);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 5px 0 var(--stroke), var(--shadow);
  margin-bottom: 18px;
  cursor: pointer;
  transition: transform .18s, box-shadow .18s;
}
.current-book-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--stroke), var(--shadow); }
.cbc-label {
  font-size: 12px; color: var(--sub); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.cbc-label::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--primary); display: inline-block;
}
.cbc-name {
  font-size: 20px; font-weight: 700; color: var(--text);
  margin-bottom: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cbc-progress-row { display: flex; align-items: center; gap: 12px; }
.cbc-bar { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.cbc-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  border-radius: 6px; width: 0%; transition: width .5s ease;
}
.cbc-progress-text { font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; }

.action-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.row-2 { display: flex; gap: 12px; }
.row-2 > * { flex: 1; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; font-size: 17px; font-weight: 700;
  padding: 17px; border-radius: 16px;
  box-shadow: 0 5px 0 var(--primary-dark);
  transition: transform .12s, box-shadow .12s;
}
.btn-primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn-ghost {
  background: var(--card); color: var(--primary);
  font-size: 16px; font-weight: 700;
  padding: 16px; border-radius: 16px;
  border: 2.5px solid var(--primary);
  box-shadow: 0 4px 0 var(--stroke);
  transition: transform .12s, box-shadow .12s;
}
.btn-ghost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--stroke); }

.home-footer {
  padding: 0 22px 18px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 10px;
}
.watermark {
  font-size: 12px; color: var(--sub); opacity: .6; letter-spacing: .5px;
  user-select: none;
}
.watermark.right { text-align: right; }

/* ---------- 学习页 ---------- */
.study-top { padding: 16px 18px 8px; display: flex; align-items: center; gap: 14px; }
.icon-btn {
  font-size: 20px; color: var(--sub); width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background .15s;
}
.icon-btn:active { background: var(--soft); }
.study-progress-wrap { flex: 1; height: 8px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.study-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  width: 0%; border-radius: 5px;
  transition: width .4s ease;
}
.study-counter { font-size: 13px; color: var(--sub); font-weight: 600; min-width: 44px; text-align: right; }

.study-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 14px 20px;
  perspective: 1400px;
  min-height: 0;
}

.flip-card {
  width: 100%; height: 100%; max-height: 460px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.3,.8,.4,1);
  cursor: pointer;
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--card);
  border: 3px solid var(--stroke);
  border-radius: 22px;
  box-shadow: 0 7px 0 var(--stroke), var(--shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 28px 22px;
  overflow: hidden;
}
.flip-back {
  transform: rotateY(180deg);
  justify-content: flex-start;
  overflow-y: auto;
  padding-top: 30px;
}
.flip-back::-webkit-scrollbar { width: 0; }

.front-zh { font-size: 62px; font-weight: 800; letter-spacing: 3px; color: var(--text); text-align: center; line-height: 1.2; }
.front-hint { position: absolute; bottom: 22px; font-size: 12px; color: var(--sub); opacity: .65; }

.back-zh { font-size: 32px; font-weight: 800; color: var(--text); }
.back-py { font-size: 17px; color: var(--sub); margin-top: 8px; letter-spacing: 1px; }
.back-th { font-size: 32px; font-weight: 800; color: var(--primary); margin-top: 14px; }

.back-rel {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-top: 14px; width: 100%;
}
.rel-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 700; color: var(--primary);
  background: var(--primary-light);
  border: 1.5px solid var(--stroke);
  padding: 5px 10px; border-radius: 20px;
  max-width: 100%; word-break: break-all;
}
.rel-chip b {
  font-size: 10px; font-weight: 900;
  background: var(--primary); color: #fff;
  width: 16px; height: 16px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.back-media { width: 100%; margin-top: 18px; }
.back-media img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; }
.back-media video { width: 100%; max-height: 220px; border-radius: 12px; background: #000; }

.back-example {
  margin-top: 16px; font-size: 14px; color: var(--text); opacity: .82; line-height: 1.7;
  background: var(--soft); padding: 12px 14px; border-radius: 12px;
  width: 100%; text-align: left; border-left: 4px solid var(--primary);
}

.speaker-btn {
  margin-top: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary-light); color: var(--primary);
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .2s;
  border: 2.5px solid var(--stroke);
  cursor: pointer;
  user-select: none;
}
.speaker-btn:active { transform: scale(.9); }
.speaker-btn.playing {
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 14px rgba(44,138,103,.4);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 4px 14px rgba(44,138,103,.4); }
  50% { box-shadow: 0 4px 20px rgba(44,138,103,.7); }
}

.study-actions { padding: 10px 20px 30px; display: flex; gap: 14px; }
.btn-know, .btn-unknown {
  flex: 1; padding: 17px; border-radius: 16px;
  font-size: 17px; font-weight: 700;
  transition: transform .12s, box-shadow .12s;
}
.btn-unknown {
  background: var(--danger-light); color: var(--danger);
  border: 2.5px solid var(--danger);
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
}
.btn-know {
  background: var(--primary-light); color: var(--primary);
  border: 2.5px solid var(--primary);
  box-shadow: 0 4px 0 var(--stroke);
}
.btn-know:active, .btn-unknown:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }

.study-next-wrap { padding: 10px 20px 30px; }
.btn-next {
  width: 100%; padding: 17px; border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 5px 0 var(--primary-dark);
  transition: transform .12s, box-shadow .12s;
}
.btn-next:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
.hidden { display: none !important; }

/* ---------- 测试页 ---------- */
.quiz-top { padding: 16px 18px 8px; display: flex; align-items: center; gap: 14px; }
.quiz-body { flex: 1; padding: 20px 22px 30px; overflow-y: auto; display: flex; flex-direction: column; }
.quiz-q-label { font-size: 12px; color: var(--sub); font-weight: 700; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }
.quiz-question {
  font-size: clamp(22px, 6.2vw, 36px);
  font-weight: 800; text-align: center; margin: 10px 0 20px; letter-spacing: 1px;
  line-height: 1.35; word-break: break-word;
}
.quiz-question.th { color: var(--primary); }
.quiz-question.blanks { white-space: pre-wrap; line-height: 1.9; }
.q-stem-media { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.q-media-img { max-width: 100%; max-height: 200px; border-radius: 12px; object-fit: contain; border: 2px solid var(--stroke); }
.q-media-video { width: 100%; max-height: 220px; border-radius: 12px; background: #000; }
.q-media-audio { width: 100%; height: 40px; }

.blank-input {
  display: inline-block;
  width: 110px;
  border: none;
  border-bottom: 3px dashed var(--primary);
  background: transparent;
  color: var(--primary);
  font-size: 0.7em;
  font-weight: 800;
  text-align: center;
  padding: 0 4px;
  margin: 0 4px;
  font-family: inherit;
  outline: none;
  vertical-align: middle;
}
.blank-input.blank-ok { border-bottom-color: var(--primary); color: var(--primary); }
.blank-input.blank-no { border-bottom-color: var(--danger); color: var(--danger); }

.quiz-options { display: flex; flex-direction: column; gap: 12px; }
.quiz-option {
  background: var(--card); border: 2.5px solid var(--stroke);
  border-radius: 14px; padding: 15px 18px;
  font-size: 17px; font-weight: 600; text-align: left;
  color: var(--text);
  box-shadow: 0 4px 0 var(--stroke);
  transition: all .15s;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
  width: 100%;
}
.quiz-option:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--stroke); }
.quiz-option.correct { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.quiz-option.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.quiz-option.locked { pointer-events: none; }
.q-opt-media { width: 100%; display: flex; flex-direction: column; gap: 6px; }

.quiz-spell-input {
  width: 100%; padding: 18px; border-radius: 14px;
  border: 2.5px solid var(--stroke); font-size: 20px;
  text-align: center; font-weight: 700; letter-spacing: 2px;
  background: var(--card); color: var(--text);
  transition: border-color .2s;
}
.quiz-spell-input:focus { border-color: var(--primary); }
.quiz-submit {
  margin-top: 18px; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 5px 0 var(--primary-dark);
  transition: transform .12s, box-shadow .12s;
}
.quiz-submit:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
.quiz-feedback { margin-top: 20px; padding: 14px 18px; border-radius: 14px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.6; }
.quiz-feedback.ok { background: var(--primary-light); color: var(--primary); }
.quiz-feedback.no { background: var(--danger-light); color: var(--danger); }

/* ---------- 结果页 ---------- */
#result-screen { align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
.result-circle { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 24px; border: 3px solid var(--stroke); }
.result-circle.ok { background: var(--primary-light); }
.result-circle.no { background: var(--danger-light); }
.result-title { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
.result-desc { font-size: 15px; color: var(--sub); margin-bottom: 36px; }
.result-actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0;
  background: rgba(20,32,27,.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(2px);
}
.modal.active { display: flex; }
.modal-content {
  width: 100%; max-width: 430px;
  max-height: 88vh;
  background: var(--bg);
  border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp .28s cubic-bezier(.2,.8,.3,1);
  overflow: hidden;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  flex-shrink: 0;
  gap: 8px;
}
.modal-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-hbtn {
  font-size: 14px; color: var(--primary); font-weight: 700;
  padding: 6px 12px; border-radius: 10px;
  transition: background .15s;
  white-space: nowrap;
}
.modal-hbtn:active { background: var(--primary-light); }
.modal-hbtn.cancel { color: var(--sub); }
.modal-body { flex: 1; overflow-y: auto; padding: 16px 18px 30px; }

.lib-tip {
  font-size: 12px; color: var(--sub); text-align: center;
  padding: 8px 12px; margin-bottom: 10px;
  background: var(--soft); border-radius: 10px; line-height: 1.6;
}

.lib-manage-bar {
  display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: flex-end;
}

.lib-item {
  background: var(--card); border-radius: 14px;
  border: 2px solid var(--stroke);
  padding: 15px 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  transition: transform .15s, box-shadow .15s, outline .1s, background .15s;
  cursor: pointer;
  user-select: none;
  position: relative;
}
.lib-item:hover { box-shadow: 0 4px 0 var(--stroke); }
.lib-item:active { transform: translateY(2px); }
.lib-item.selected {
  background: var(--primary-light);
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.lib-item-main { flex: 1; min-width: 0; }
.lib-item-title {
  font-size: 16px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lib-item-title.current { color: var(--primary); }
.lib-item-title.current::after {
  content: ' · 当前'; font-size: 12px; font-weight: 600;
  color: var(--primary);
}
.lib-item-sub { font-size: 12px; color: var(--sub); margin-top: 5px; }
.lib-item-actions { display: flex; gap: 6px; align-items: center; }
.mini-btn {
  font-size: 12px; padding: 7px 11px; border-radius: 9px;
  background: var(--primary-light); color: var(--primary);
  font-weight: 700; white-space: nowrap;
  border: 1.5px solid var(--stroke);
  transition: transform .12s;
}
.mini-btn:active { transform: scale(.94); }
.mini-btn.danger { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
.mini-btn.gray { background: var(--soft); color: var(--sub); border-color: var(--border); }
.mini-btn:disabled { opacity: .42; cursor: not-allowed; }

.empty-tip { text-align: center; color: var(--sub); font-size: 14px; padding: 50px 20px; line-height: 1.9; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 7px; }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 13px 15px; border-radius: 12px;
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 15px; color: var(--text);
  transition: border-color .2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); }
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; min-width: 0; }

/* 媒体编辑器 */
.me-box { display: flex; flex-direction: column; gap: 7px; }
.me-row { display: flex; align-items: center; gap: 6px; }
.me-ico { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; opacity: .8; }
.me-inp {
  flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 12.5px; color: var(--text);
}
.me-inp:focus { border-color: var(--primary); }
.me-up {
  font-size: 13px; padding: 8px 9px; border-radius: 9px;
  background: var(--primary-light); color: var(--primary);
  border: 1.5px solid var(--stroke);
  cursor: pointer; flex-shrink: 0; line-height: 1;
}

/* 选项卡 */
.opt-card {
  background: var(--card); border: 2px solid var(--stroke);
  border-radius: 13px; padding: 11px; margin-bottom: 9px;
}
.opt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.opt-mark {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--stroke); background: var(--soft);
  color: var(--sub); font-size: 14px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s;
}
.opt-mark.on { background: var(--primary); border-color: var(--primary-dark); color: #fff; }
.opt-head .form-input { padding: 9px 11px; font-size: 14px; }
.opt-del {
  width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
  background: var(--danger-light); color: var(--danger);
  font-size: 13px; font-weight: 900;
  border: 1.5px solid var(--danger);
}

.seg { display: flex; gap: 8px; }
.seg-btn {
  flex: 1; padding: 11px; border-radius: 12px;
  border: 2px solid var(--stroke); background: var(--card);
  font-size: 14px; font-weight: 700; color: var(--sub);
  transition: all .15s;
}
.seg-btn.on {
  background: var(--primary-light); color: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 3px 0 var(--stroke);
}

.detail-word { font-size: 36px; font-weight: 800; text-align: center; margin-bottom: 6px; }
.detail-py { font-size: 16px; color: var(--sub); text-align: center; letter-spacing: 1px; }
.detail-th { font-size: 28px; font-weight: 800; color: var(--primary); text-align: center; margin: 12px 0 20px; }
.detail-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 14px; margin-bottom: 14px; border: 2px solid var(--stroke); }
.detail-video { width: 100%; max-height: 240px; border-radius: 14px; background: #000; margin-bottom: 14px; }
.detail-example {
  font-size: 14px; color: var(--text); opacity: .85; line-height: 1.7;
  background: var(--soft); padding: 13px 15px; border-radius: 12px;
  border-left: 4px solid var(--primary); margin-bottom: 14px;
}
.detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.detail-actions button { padding: 14px; border-radius: 13px; font-size: 15px; font-weight: 700; }
.btn-danger-soft { background: var(--danger-light); color: var(--danger); border: 2px solid var(--danger); }
.btn-primary-soft { background: var(--primary-light); color: var(--primary); border: 2px solid var(--stroke); }
.btn-primary-solid { background: var(--primary); color: #fff; }

.upload-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: var(--primary);
  background: var(--primary-light); padding: 9px 14px;
  border-radius: 11px; margin-top: 8px; cursor: pointer;
  border: 1.5px solid var(--stroke);
}

.toast {
  position: fixed; left: 50%; bottom: 90px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,42,37,.92); color: #fff;
  font-size: 14px; font-weight: 600;
  padding: 12px 22px; border-radius: 22px;
  opacity: 0; pointer-events: none;
  transition: all .3s;
  z-index: 9999;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 右键菜单 ---------- */
.context-menu {
  position: fixed;
  background: var(--card);
  border-radius: 12px;
  border: 2px solid var(--stroke);
  box-shadow: 0 6px 0 var(--stroke), 0 14px 34px rgba(0,0,0,0.18);
  padding: 6px;
  display: none;
  z-index: 10000;
  min-width: 150px;
  animation: ctxIn .14s ease;
}
@keyframes ctxIn {
  from { opacity: 0; transform: scale(.94); }
  to { opacity: 1; transform: scale(1); }
}
.context-menu.active { display: block; }
.ctx-item {
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  transition: background .12s;
  white-space: nowrap;
}
.ctx-item:hover { background: var(--primary-light); color: var(--primary); }
.ctx-item.danger { color: var(--danger); }
.ctx-item.danger:hover { background: var(--danger-light); color: var(--danger); }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 8px; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="app">

  <!-- ================= 首页 ================= -->

      <button class="top-btn theme-btn" id="theme-btn" onclick="toggleThemePanel(event)">🎨 主题</button>

    </div>

    <!-- 主题面板 -->

    <div class="home-body">
      <div class="home-title">记忆词汇</div>

      <div class="current-book-card" onclick="openLibrary()">

        <div class="cbc-progress-row">

      <div class="action-list">

    <div class="home-footer">

      <span class="watermark right">李咏宸设计Deepseek制作</span>
    </div>
  </div>

  <!-- ================= 学习页 ================= -->

    <div class="study-actions" id="study-actions">

      <button class="btn-know" onclick="answerStudy(true)">认 识</button>
    </div>
    <div class="study-next-wrap hidden" id="study-next-wrap">
      <button class="btn-next" onclick="nextStudyCard()">下一个 →</button>
    </div>

  <!-- ================= 测试页 ================= -->

        <div class="study-progress-fill" id="quiz-fill"></div>
      </div>
      <div class="study-counter" id="quiz-counter">0/0</div>
    </div>
    <div class="quiz-body" id="quiz-body"></div>
  </div>

  <!-- ================= 结果页 ================= -->

<script>
/* =========================================================
   1. 工具函数
   ========================================================= */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function normText(s) {
  return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, '');
}
function parseBlanks(stem) {
  const re = /\[\[(.+?)\]\]/g;
  const out = [];
  let m;
  while ((m = re.exec(String(stem || ''))) !== null) out.push(m[1].trim());
  return out;
}
function stemWithBlanksHTML(stem) {
  const parts = String(stem || '').split(/\[\[(.+?)\]\]/g);
  let html = '';
  let idx = 0;
  parts.forEach((p, i) => {
    if (i % 2 === 1) {
      html += `<input class="blank-input" data-blank="${idx++}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
    } else {
      html += esc(p);
    }
  });
  return html;
}

/* =========================================================
   2. IndexedDB 媒体存储
   ========================================================= */
let _mediaDB = null;
let _mediaUrlCache = {};

function openMediaDB() {
  return new Promise((resolve, reject) => {
    if (_mediaDB) return resolve(_mediaDB);
    const req = indexedDB.open('thai_vocab_media', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
    };
    req.onsuccess = e => { _mediaDB = e.target.result; resolve(_mediaDB); };
    req.onerror = e => reject(e.target.error);
  });
}
function saveMedia(blob, forcedId) {
  return new Promise(async (resolve, reject) => {
    try {
      const db = await openMediaDB();
      const id = forcedId || uid();
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put(blob, id);
      tx.oncomplete = () => resolve(id);
      tx.onerror = e => reject(e.target.error);
    } catch (e) { reject(e); }
  });
}
function getMediaBlob(id) {
  return new Promise(async (resolve, reject) => {
    try {
      const db = await openMediaDB();
      const tx = db.transaction('files', 'readonly');
      const req = tx.objectStore('files').get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = e => reject(e.target.error);
    } catch (e) { reject(e); }
  });
}
function deleteMedia(id) {
  return new Promise(async (resolve) => {
    try {
      const db = await openMediaDB();
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}
async function resolveMediaUrl(src) {
  if (!src || typeof src !== 'string') return '';
  if (!src.startsWith('media:')) return src;
  const id = src.slice(6);
  if (_mediaUrlCache[id]) return _mediaUrlCache[id];
  try {
    const blob = await getMediaBlob(id);
    if (!blob) return '';
    const url = URL.createObjectURL(blob);
    _mediaUrlCache[id] = url;
    return url;
  } catch (e) { console.warn('媒体读取失败', id, e); return ''; }
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

let state = null;

/* ---------- 构造器 ---------- */
function newSub(name) { return { id: uid(), name: name || '子章节', words: [] }; }
function newChapter(name) { return { id: uid(), name: name || '章节', subchapters: [newSub('默认子章节')] }; }
function newBook(name) { return { id: uid(), name: name, chapters: [newChapter('第 1 章')] }; }
function newBankChapter(name) {
  return { id: uid(), name: name || '新章节', subchapters: [{ id: uid(), name: '默认子章节', questions: [] }] };
}

function initDefaultState() {
  const lines = DEFAULT_WORDS_RAW.split('\n').filter(l => l.trim());
  const words = lines.map(line => {
    const [zh, py, th] = line.split('|');
    return {
      id: uid(), zh: (zh || '').trim(), py: (py || '').trim(), th: (th || '').trim(),
      image: '', audio: '', video: '', example: '',
      syn: '', ant: '', near: ''
    };
  });

  // 每 30 词一个子章节，每 2 个子章节一个章节
  const subs = [];
  for (let i = 0; i < words.length; i += 30) {
    subs.push({ id: uid(), name: '子章节 ' + (subs.length + 1), words: words.slice(i, i + 30) });
  }
  const chapters = [];
  for (let i = 0; i < subs.length; i += 2) {
    chapters.push({
      id: uid(),
      name: '第 ' + (chapters.length + 1) + ' 章',
      subchapters: subs.slice(i, i + 2)
    });
  }
  const book = {
    id: uid(),
    name: '基础泰语词汇（入门）',
    chapters: chapters.length ? chapters : [newChapter('第 1 章')]
  };
  state = {
    books: [book],
    currentBookId: book.id,
    wordStatus: {},
    bankChapters: [],
    version: 2
  };
}

/* ---------- 迁移 ---------- */
function migrateState(s) {
  if (!s || !Array.isArray(s.books)) return s;

  s.books.forEach(b => {
    if (!Array.isArray(b.chapters)) b.chapters = [];
    b.chapters.forEach(c => {
      if (!Array.isArray(c.subchapters)) {
        const words = Array.isArray(c.words) ? c.words : [];
        c.subchapters = [{ id: uid(), name: '默认子章节', words }];
        delete c.words;
      }
      c.subchapters.forEach(sub => {
        if (!Array.isArray(sub.words)) sub.words = [];
        sub.words.forEach(w => {
          if (w.syn == null) w.syn = '';
          if (w.ant == null) w.ant = '';
          if (w.near == null) w.near = '';
        });
      });
    });
  });

  if (!Array.isArray(s.bankChapters)) {
    s.bankChapters = [];
    if (Array.isArray(s.questionBank) && s.questionBank.length) {
      s.bankChapters.push({
        id: uid(), name: '默认章节',
        subchapters: [{ id: uid(), name: '默认子章节', questions: s.questionBank }]
      });
    }
    delete s.questionBank;
  }
  s.bankChapters.forEach(bc => {
    if (!Array.isArray(bc.subchapters)) bc.subchapters = [];
    bc.subchapters.forEach(sb => {
      if (!Array.isArray(sb.questions)) sb.questions = [];
    });
  });

  if (!s.wordStatus) s.wordStatus = {};
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.books) && parsed.books.length) {
        state = migrateState(parsed);
        if (!state.currentBookId || !state.books.find(b => b.id === state.currentBookId)) {
          state.currentBookId = state.books[0].id;
        }
        return;
      }
    }
  } catch (e) { console.warn('读取存档失败', e); }
  initDefaultState();
  saveState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('保存失败', e);
    toast('保存失败：' + e.message);
  }
}

/* ---------- 查询工具 ---------- */
function getCurrentBook() { return state.books.find(b => b.id === state.currentBookId) || state.books[0] || null; }
function findBook(bookId) { return state.books.find(b => b.id === bookId) || null; }
function findChapter(bookId, chapterId) {
  const b = findBook(bookId);
  if (!b) return null;
  return (b.chapters || []).find(c => c.id === chapterId) || null;
}
function findSub(bookId, chapterId, subId) {
  const c = findChapter(bookId, chapterId);
  if (!c) return null;
  return (c.subchapters || []).find(s => s.id === subId) || null;
}
function findWord(bookId, chapterId, subId, wordId) {
  const s = findSub(bookId, chapterId, subId);
  if (!s) return null;
  return (s.words || []).find(w => w.id === wordId) || null;
}
function chapterWords(chapter) {
  const out = [];
  if (!chapter) return out;
  (chapter.subchapters || []).forEach(s => (s.words || []).forEach(w => out.push(w)));
  return out;
}
function bookWords(book) {
  const out = [];
  if (!book) return out;
  (book.chapters || []).forEach(c => chapterWords(c).forEach(w => out.push(w)));
  return out;
}
function countBookWords(book) { return bookWords(book).length; }
function getAllWords() {
  const out = [];
  state.books.forEach(b => bookWords(b).forEach(w => out.push(w)));
  return out;
}
function allBankQuestions() {
  const out = [];
  (state.bankChapters || []).forEach(c => (c.subchapters || []).forEach(s => (s.questions || []).forEach(q => out.push(q))));
  return out;
}
function findBankChapter(id) { return (state.bankChapters || []).find(c => c.id === id) || null; }
function findBankSub(chapterId, subId) {
  const c = findBankChapter(chapterId);
  if (!c) return null;
  return (c.subchapters || []).find(s => s.id === subId) || null;
}
function findBankQuestion(chapterId, subId, qId) {
  const s = findBankSub(chapterId, subId);
  if (!s) return null;
  return (s.questions || []).find(q => q.id === qId) || null;
}

  if (e) e.stopPropagation();
  const pop = document.getElementById('theme-pop');
  const btn = document.getElementById('theme-btn');
  const willOpen = !pop.classList.contains('active');
  pop.classList.toggle('active', willOpen);
  btn.classList.toggle('on', willOpen);
  if (willOpen) buildThemeGrid();
}

document.addEventListener('click', e => {
  const pop = document.getElementById('theme-pop');
  if (!pop || !pop.classList.contains('active')) return;
  if (e.target.closest('#theme-pop') || e.target.closest('#theme-btn')) return;
  pop.classList.remove('active');
  document.getElementById('theme-btn').classList.remove('on');
});

/* =========================================================
   5. 页面切换 & 弹窗
   ========================================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

/* =========================================================
   6. 右键菜单
   ========================================================= */
function showContextMenu(x, y, items) {
  const menu = document.getElementById('context-menu');
  menu.innerHTML = items.map((it, i) => {
    if (it.sep) return '<div class="ctx-sep"></div>';
    return `<div class="ctx-item ${it.danger ? 'danger' : ''}" data-idx="${i}">${esc(it.label)}</div>`;
  }).join('');
  menu.querySelectorAll('.ctx-item').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const it = items[+el.dataset.idx];
      hideContextMenu();
      if (it && it.onClick) it.onClick();
    };
  });
  menu.classList.add('active');
  const w = 176, h = menu.offsetHeight || 160;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
}
function hideContextMenu() {
  document.getElementById('context-menu').classList.remove('active');
}
document.addEventListener('click', hideContextMenu);
document.addEventListener('scroll', hideContextMenu, true);

/* =========================================================
   7. 首页渲染
   ========================================================= */
function renderHome() {
  const book = getCurrentBook();
  const nameEl = document.getElementById('home-book-name');
  const fillEl = document.getElementById('home-book-fill');
  const textEl = document.getElementById('home-book-text');

  if (!book) {
    nameEl.textContent = '暂无词书，点击新建';
    fillEl.style.width = '0%';
    textEl.textContent = '0 / 0';
  } else {
    nameEl.textContent = book.name;
    const total = countBookWords(book);
    let done = 0;
    bookWords(book).forEach(w => { if (state.wordStatus[w.id]) done++; });
    const pct = total ? (done / total * 100) : 0;
    fillEl.style.width = pct + '%';
    textEl.textContent = done + ' / ' + total;
  }

  const bc = document.getElementById('bank-cnt');
  if (bc) {
    const n = allBankQuestions().length;
    bc.textContent = n ? '(' + n + ')' : '';
  }
}

/* =========================================================
   8. 词库（词书 → 章节 → 子章节 → 单词）
   ========================================================= */
let libState = { view: 'books', bookId: null, chapterId: null, subId: null };
let libSelected = new Set();
let libSelectAll = false;

function resetLibSelection() {
  libSelected.clear();
  libSelectAll = false;
}

function openLibrary() {
  libState = { view: 'books', bookId: null, chapterId: null, subId: null };
  resetLibSelection();
  renderLibrary();
  openModal('library-modal');
}

function manageBarHTML(showMove) {
  return `<div class="lib-manage-bar">
    <button class="mini-btn" id="lib-select-all-btn" onclick="toggleSelectAll()">全选</button>
    ${showMove ? `<button class="mini-btn" id="lib-move-btn" onclick="moveSelected()" disabled>移动选中</button>` : ''}
    <button class="mini-btn danger" id="lib-delete-selected-btn" onclick="deleteSelected()" disabled>删除选中</button>
  </div>`;
}

function renderLibrary() {
  const body = document.getElementById('lib-body');
  const title = document.getElementById('lib-title');
  const action = document.getElementById('lib-header-action');
  const v = libState.view;

  if (v === 'books') {
    title.textContent = '我的词书';
    action.innerHTML = `<button class="modal-hbtn" onclick="addBook()">＋ 新建</button>`;
    if (!state.books.length) {
      body.innerHTML = '<div class="empty-tip">还没有词书，点击右上角新建一本吧</div>';
      return;
    }
    body.innerHTML = '<div class="lib-tip">💡 单击进入 · 右键修改/删除 · 可勾选批量操作</div>' +
      manageBarHTML(false) +
      state.books.map(b => {
        const isCurrent = b.id === state.currentBookId;
        return `
        <div class="lib-item" data-open-book="${b.id}" data-ctx-book="${b.id}" data-select-id="${b.id}">
          <div class="lib-item-main">
            <div class="lib-item-title ${isCurrent ? 'current' : ''}">${esc(b.name)}</div>
            <div class="lib-item-sub">${b.chapters.length} 章 · ${countBookWords(b)} 个词</div>
          </div>
          <div class="lib-item-actions">
            ${isCurrent ? '' : `<button class="mini-btn" data-set-current="${b.id}">设为当前</button>`}
          </div>
        </div>`;
      }).join('');
  }
  else if (v === 'chapters') {
    const b = findBook(libState.bookId);
    if (!b) { libState.view = 'books'; return renderLibrary(); }
    title.textContent = b.name;
    action.innerHTML = `<button class="modal-hbtn" onclick="addChapter()">＋ 章节</button>`;
    body.innerHTML =
      `<div class="lib-item" data-back="1">
        <div class="lib-item-main"><div class="lib-item-title">← 返回词书列表</div></div>
      </div>
      <div class="lib-tip">💡 单击进入章节 · 可勾选批量移动或删除</div>` +
      manageBarHTML(true) +
      (b.chapters.length ? b.chapters.map(c => `
        <div class="lib-item" data-open-chapter="${c.id}" data-book-id="${b.id}"
             data-ctx-chapter="${c.id}" data-select-id="${c.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc(c.name)}</div>
            <div class="lib-item-sub">${(c.subchapters || []).length} 个子章节 · ${chapterWords(c).length} 个词</div>
          </div>
        </div>`).join('') : '<div class="empty-tip">还没有章节</div>');
  }
  else if (v === 'subs') {
    const c = findChapter(libState.bookId, libState.chapterId);
    if (!c) { libState.view = 'chapters'; return renderLibrary(); }
    title.textContent = c.name;
    action.innerHTML = `<button class="modal-hbtn" onclick="addSubchapter()">＋ 子章节</button>`;
    body.innerHTML =
      `<div class="lib-item" data-back="1">
        <div class="lib-item-main"><div class="lib-item-title">← 返回章节列表</div></div>
      </div>
      <div class="lib-tip">💡 单击进入子章节 · 可勾选批量移动或删除</div>` +
      manageBarHTML(true) +
      ((c.subchapters || []).length ? c.subchapters.map(s => `
        <div class="lib-item" data-open-sub="${s.id}" data-book-id="${libState.bookId}"
             data-chapter-id="${c.id}" data-ctx-sub="${s.id}" data-select-id="${s.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc(s.name)}</div>
            <div class="lib-item-sub">${s.words.length} 个词</div>
          </div>
        </div>`).join('') : '<div class="empty-tip">还没有子章节</div>');
  }
  else {
    const s = findSub(libState.bookId, libState.chapterId, libState.subId);
    if (!s) { libState.view = 'subs'; return renderLibrary(); }
    title.textContent = s.name;
    action.innerHTML = `<button class="modal-hbtn" onclick="openWordForm()">＋ 添加</button>`;
    body.innerHTML =
      `<div class="lib-item" data-back="1">
        <div class="lib-item-main"><div class="lib-item-title">← 返回子章节列表</div></div>
      </div>
      <div style="margin:12px 0 4px;display:flex;gap:8px;">
        <button class="mini-btn" style="flex:1;padding:11px;" onclick="openWordForm()">➕ 单个添加</button>
        <button class="mini-btn" style="flex:1;padding:11px;" onclick="openBatchModal()">📋 批量添加</button>
      </div>
      <div class="lib-tip">💡 单击查看详情 · 右键编辑/删除 · 可勾选批量移动</div>` +
      manageBarHTML(true) +
      (s.words.length ? s.words.map(w => `
        <div class="lib-item" data-open-word="${w.id}" data-book-id="${libState.bookId}"
             data-chapter-id="${libState.chapterId}" data-sub-id="${libState.subId}"
             data-ctx-word="${w.id}" data-select-id="${w.id}">
          <div class="lib-item-main">
            <div class="lib-item-title">${esc(w.zh)}</div>
            <div class="lib-item-sub">${esc(w.th)} · ${esc(w.py || '—')}${w.image || w.audio || w.video ? ' · 📎' : ''}${(w.syn || w.ant || w.near) ? ' · 🔗' : ''}</div>
          </div>
        </div>`).join('') : '<div class="empty-tip">这个子章节还没有单词</div>');
  }

  updateSelectionUI();
  updateManageButtons();
}

function updateSelectionUI() {
  document.querySelectorAll('#lib-body .lib-item[data-select-id]').forEach(el => {
    if (libSelected.has(el.dataset.selectId)) el.classList.add('selected');
    else el.classList.remove('selected');
  });
}

function updateManageButtons() {
  const selectAllBtn = document.getElementById('lib-select-all-btn');
  const deleteBtn = document.getElementById('lib-delete-selected-btn');
  const moveBtn = document.getElementById('lib-move-btn');
  if (!selectAllBtn || !deleteBtn) return;
  selectAllBtn.textContent = libSelectAll ? '取消全选' : '全选';
  const count = libSelected.size;
  deleteBtn.textContent = count > 0 ? `删除选中 (${count})` : '删除选中';
  deleteBtn.disabled = count === 0;
  if (moveBtn) {
    moveBtn.textContent = count > 0 ? `移动选中 (${count})` : '移动选中';
    moveBtn.disabled = count === 0;
  }
}

function currentViewIds() {
  const v = libState.view;
  if (v === 'books') return state.books.map(b => b.id);
  if (v === 'chapters') {
    const b = findBook(libState.bookId);
    return b ? b.chapters.map(c => c.id) : [];
  }
  if (v === 'subs') {
    const c = findChapter(libState.bookId, libState.chapterId);
    return c ? (c.subchapters || []).map(s => s.id) : [];
  }
  const s = findSub(libState.bookId, libState.chapterId, libState.subId);
  return s ? s.words.map(w => w.id) : [];
}

function toggleSelectAll() {
  const allIds = currentViewIds();
  if (libSelectAll) {
    libSelected.clear();
    libSelectAll = false;
  } else {
    libSelected = new Set(allIds);
    libSelectAll = true;
  }
  updateSelectionUI();
  updateManageButtons();
}

function deleteSelected() {
  if (libSelected.size === 0) return;
  const v = libState.view;
  let msg = '';
  if (v === 'books') msg = `确定删除选中的 ${libSelected.size} 本词书吗？其中的所有章节、子章节和单词都会被移除。`;
  else if (v === 'chapters') msg = `确定删除选中的 ${libSelected.size} 个章节吗？其中的所有子章节和单词都会被移除。`;
  else if (v === 'subs') msg = `确定删除选中的 ${libSelected.size} 个子章节吗？其中的所有单词都会被移除。`;
  else msg = `确定删除选中的 ${libSelected.size} 个单词吗？`;
  if (!confirm(msg)) return;

  const ids = Array.from(libSelected);

  if (v === 'books') {
    ids.forEach(id => {
      const book = findBook(id);
      if (book) bookWords(book).forEach(w => cleanupWordMedia(w));
    });
    state.books = state.books.filter(b => !libSelected.has(b.id));
    if (state.currentBookId && !state.books.find(b => b.id === state.currentBookId)) {
      state.currentBookId = state.books[0] ? state.books[0].id : null;
    }
  } else if (v === 'chapters') {
    const book = findBook(libState.bookId);
    if (book) {
      book.chapters.forEach(c => {
        if (libSelected.has(c.id)) chapterWords(c).forEach(w => cleanupWordMedia(w));
      });
      book.chapters = book.chapters.filter(c => !libSelected.has(c.id));
    }
  } else if (v === 'subs') {
    const c = findChapter(libState.bookId, libState.chapterId);
    if (c) {
      (c.subchapters || []).forEach(s => {
        if (libSelected.has(s.id)) s.words.forEach(w => cleanupWordMedia(w));
      });
      c.subchapters = (c.subchapters || []).filter(s => !libSelected.has(s.id));
    }
  } else {
    const s = findSub(libState.bookId, libState.chapterId, libState.subId);
    if (s) {
      s.words.forEach(w => { if (libSelected.has(w.id)) { cleanupWordMedia(w); delete state.wordStatus[w.id]; } });
      s.words = s.words.filter(w => !libSelected.has(w.id));
    }
  }

  resetLibSelection();
  saveState();
  renderLibrary();
  renderHome();
  toast('已删除选中项');
}

function libBack() {
  resetLibSelection();
  const v = libState.view;
  if (v === 'words') { libState.view = 'subs'; libState.subId = null; }
  else if (v === 'subs') { libState.view = 'chapters'; libState.chapterId = null; }
  else if (v === 'chapters') { libState.view = 'books'; libState.bookId = null; }
  renderLibrary();
}

function openBookInLib(bookId) {
  resetLibSelection();
  libState.view = 'chapters';
  libState.bookId = bookId;
  libState.chapterId = null;
  libState.subId = null;
  renderLibrary();
}
function openChapterInLib(bookId, chapterId) {
  resetLibSelection();
  libState.view = 'subs';
  libState.bookId = bookId;
  libState.chapterId = chapterId;
  libState.subId = null;
  renderLibrary();
}
function openSubInLib(bookId, chapterId, subId) {
  resetLibSelection();
  libState.view = 'words';
  libState.bookId = bookId;
  libState.chapterId = chapterId;
  libState.subId = subId;
  renderLibrary();
}

function setCurrentBook(bookId) {
  state.currentBookId = bookId;
  saveState();
  renderHome();
  renderLibrary();
  toast('已切换当前词书');
}

/* ---------- 词库增删改 ---------- */
function addBook() {
  const name = prompt('请输入新词书名称：', '我的词书 ' + (state.books.length + 1));
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return toast('名称不能为空');
  const book = newBook(trimmed);
  state.books.push(book);
  if (!state.currentBookId) state.currentBookId = book.id;
  saveState();
  renderLibrary();
  renderHome();
  toast('词书已创建');
}

function deleteBook(bookId) {
  if (!confirm('确定删除这本词书吗？其中的所有内容都会被移除。')) return;
  const book = findBook(bookId);
  if (book) bookWords(book).forEach(w => cleanupWordMedia(w));
  state.books = state.books.filter(b => b.id !== bookId);
  if (state.currentBookId === bookId) {
    state.currentBookId = state.books[0] ? state.books[0].id : null;
  }
  resetLibSelection();
  saveState();
  renderLibrary();
  renderHome();
  toast('已删除');
}

function addChapter() {
  const book = findBook(libState.bookId);
  if (!book) return;
  const name = prompt('请输入章节名称：', '第 ' + (book.chapters.length + 1) + ' 章');
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return toast('名称不能为空');
  book.chapters.push(newChapter(trimmed));
  saveState();
  renderLibrary();
  toast('章节已创建');
}

function addSubchapter() {
  const c = findChapter(libState.bookId, libState.chapterId);
  if (!c) return;
  const name = prompt('请输入子章节名称：', '子章节 ' + ((c.subchapters || []).length + 1));
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return toast('名称不能为空');
  if (!Array.isArray(c.subchapters)) c.subchapters = [];
  c.subchapters.push(newSub(trimmed));
  saveState();
  renderLibrary();
  toast('子章节已创建');
}

function deleteChapter(chapterId, bookId) {
  bookId = bookId || libState.bookId;
  const book = findBook(bookId);
  if (!book) return;
  if (!confirm('确定删除这个章节吗？')) return;
  const chap = book.chapters.find(c => c.id === chapterId);
  if (chap) chapterWords(chap).forEach(w => cleanupWordMedia(w));
  book.chapters = book.chapters.filter(c => c.id !== chapterId);
  resetLibSelection();
  saveState();
  renderLibrary();
  renderHome();
  toast('已删除');
}

function deleteSubchapter(subId, bookId, chapterId) {
  bookId = bookId || libState.bookId;
  chapterId = chapterId || libState.chapterId;
  const c = findChapter(bookId, chapterId);
  if (!c) return;
  if (!confirm('确定删除这个子章节吗？')) return;
  const sub = (c.subchapters || []).find(s => s.id === subId);
  if (sub) sub.words.forEach(w => cleanupWordMedia(w));
  c.subchapters = (c.subchapters || []).filter(s => s.id !== subId);
  resetLibSelection();
  saveState();
  renderLibrary();
  renderHome();
  toast('已删除');
}

function renameBookById(bookId) {
  const b = findBook(bookId);
  if (!b) return;
  const name = prompt('修改词书名称：', b.name);
  if (name === null) return;
  const t = name.trim();
  if (!t) return;
  b.name = t;
  saveState(); renderLibrary(); renderHome();
  toast('已重命名');
}

function renameChapterById(bookId, chapterId) {
  const c = findChapter(bookId, chapterId);
  if (!c) return;
  const name = prompt('修改章节名称：', c.name);
  if (name === null) return;
  const t = name.trim();
  if (!t) return;
  c.name = t;
  saveState(); renderLibrary();
  toast('已重命名');
}

function renameSubById(bookId, chapterId, subId) {
  const s = findSub(bookId, chapterId, subId);
  if (!s) return;
  const name = prompt('修改子章节名称：', s.name);
  if (name === null) return;
  const t = name.trim();
  if (!t) return;
  s.name = t;
  saveState(); renderLibrary();
  toast('已重命名');
}

/* ---------- 上下文菜单 ---------- */
function showBookContextMenu(x, y, bookId) {
  const book = findBook(bookId);
  if (!book) return;
  const isCurrent = bookId === state.currentBookId;
  const items = [
    { label: '✏️ 重命名', onClick: () => renameBookById(bookId) },
    { label: '➕ 新建章节', onClick: () => {
      libState = { view: 'chapters', bookId, chapterId: null, subId: null };
      addChapter();
    }}
  ];
  if (!isCurrent) items.push({ label: '⭐ 设为当前', onClick: () => setCurrentBook(bookId) });
  items.push({ sep: true });
  items.push({ label: '🗑 删除词书', danger: true, onClick: () => deleteBook(bookId) });
  showContextMenu(x, y, items);
}

function showChapterContextMenu(x, y, bookId, chapterId) {
  const items = [
    { label: '✏️ 重命名', onClick: () => renameChapterById(bookId, chapterId) },
    { sep: true },
    { label: '🗑 删除章节', danger: true, onClick: () => deleteChapter(chapterId, bookId) }
  ];
  showContextMenu(x, y, items);
}

function showSubContextMenu(x, y, bookId, chapterId, subId) {
  const items = [
    { label: '✏️ 重命名', onClick: () => renameSubById(bookId, chapterId, subId) },
    { sep: true },
    { label: '🗑 删除子章节', danger: true, onClick: () => deleteSubchapter(subId, bookId, chapterId) }
  ];
  showContextMenu(x, y, items);
}

function showWordContextMenu(x, y, bookId, chapterId, subId, wordId) {
  const items = [
    { label: '✏️ 编辑单词', onClick: () => {
      libState = { view: 'words', bookId, chapterId, subId };
      editWordInLib(wordId);
    }},
    { label: '👁 查看详情', onClick: () => openWordDetail(bookId, chapterId, subId, wordId) },
    { sep: true },
    { label: '🗑 删除单词', danger: true, onClick: () => {
      libState = { view: 'words', bookId, chapterId, subId };
      deleteWordInLib(wordId);
    }}
  ];
  showContextMenu(x, y, items);
}

/* ---------- 词库事件委托 ---------- */
function bindLibEvents() {
  const body = document.getElementById('lib-body');
  if (body._bound) return;
  body._bound = true;

  body.addEventListener('click', e => {
    const target = e.target;

    const setCur = target.closest('[data-set-current]');
    if (setCur) {
      e.stopPropagation();
      setCurrentBook(setCur.dataset.setCurrent);
      return;
    }

    if (target.closest('[data-back]')) { libBack(); return; }

    const openBook = target.closest('[data-open-book]');
    if (openBook) { openBookInLib(openBook.dataset.openBook); return; }

    const openChapter = target.closest('[data-open-chapter]');
    if (openChapter) {
      openChapterInLib(openChapter.dataset.bookId, openChapter.dataset.openChapter);
      return;
    }

    const openSub = target.closest('[data-open-sub]');
    if (openSub) {
      openSubInLib(openSub.dataset.bookId, openSub.dataset.chapterId, openSub.dataset.openSub);
      return;
    }

    const openWord = target.closest('[data-open-word]');
    if (openWord) {
      openWordDetail(openWord.dataset.bookId, openWord.dataset.chapterId,
        openWord.dataset.subId, openWord.dataset.openWord);
      return;
    }

    // 勾选
    const item = target.closest('.lib-item[data-select-id]');
    if (item) {
      const id = item.dataset.selectId;
      if (libSelected.has(id)) libSelected.delete(id);
      else libSelected.add(id);
      libSelectAll = libSelected.size === currentViewIds().length && libSelected.size > 0;
      updateSelectionUI();
      updateManageButtons();
    }
  });

  body.addEventListener('contextmenu', e => {
    const target = e.target;
    const bookEl = target.closest('[data-ctx-book]');
    if (bookEl) {
      e.preventDefault();
      showBookContextMenu(e.clientX, e.clientY, bookEl.dataset.ctxBook);
      return;
    }
    const chapEl = target.closest('[data-ctx-chapter]');
    if (chapEl) {
      e.preventDefault();
      showChapterContextMenu(e.clientX, e.clientY, chapEl.dataset.bookId, chapEl.dataset.ctxChapter);
      return;
    }
    const subEl = target.closest('[data-ctx-sub]');
    if (subEl) {
      e.preventDefault();
      showSubContextMenu(e.clientX, e.clientY, subEl.dataset.bookId, subEl.dataset.chapterId, subEl.dataset.ctxSub);
      return;
    }
    const wordEl = target.closest('[data-ctx-word]');
    if (wordEl) {
      e.preventDefault();
      showWordContextMenu(e.clientX, e.clientY, wordEl.dataset.bookId,
        wordEl.dataset.chapterId, wordEl.dataset.subId, wordEl.dataset.ctxWord);
      return;
    }
  });

  let lpTimer = null;
  body.addEventListener('touchstart', e => {
    const item = e.target.closest('[data-ctx-book],[data-ctx-chapter],[data-ctx-sub],[data-ctx-word]');
    if (!item) return;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => {
      const touch = e.touches[0];
      if (item.dataset.ctxBook) showBookContextMenu(touch.clientX, touch.clientY, item.dataset.ctxBook);
      else if (item.dataset.ctxChapter) showChapterContextMenu(touch.clientX, touch.clientY, item.dataset.bookId, item.dataset.ctxChapter);
      else if (item.dataset.ctxSub) showSubContextMenu(touch.clientX, touch.clientY, item.dataset.bookId, item.dataset.chapterId, item.dataset.ctxSub);
      else if (item.dataset.ctxWord) showWordContextMenu(touch.clientX, touch.clientY, item.dataset.bookId, item.dataset.chapterId, item.dataset.subId, item.dataset.ctxWord);
      item._lpFired = Date.now();
    }, 550);
  }, { passive: true });
  body.addEventListener('touchmove', () => clearTimeout(lpTimer), { passive: true });
  body.addEventListener('touchend', e => {
    clearTimeout(lpTimer);
    const item = e.target.closest('.lib-item');
    if (item && item._lpFired && Date.now() - item._lpFired < 800) {
      e.preventDefault();
      e.stopPropagation();
      item._lpFired = 0;
    }
  }, { passive: false });
}

let moveCtx = null;

function moveSelected() {
  const v = libState.view;
  if (v === 'books') return toast('词书本身不支持移动，可删除后重建');
  const ids = Array.from(libSelected);
  if (!ids.length) return toast('请先勾选要移动的内容');

  let kind = v, options = [];
  if (v === 'words') {
    state.books.forEach(b => (b.chapters || []).forEach(c => (c.subchapters || []).forEach(s => {
      options.push({
        value: b.id + '|' + c.id + '|' + s.id,
        label: `${b.name} · ${c.name} · ${s.name}`
      });
    })));
    if (!options.length) return toast('没有可用的目标位置');
  } else if (v === 'subs') {
    state.books.forEach(b => (b.chapters || []).forEach(c => {
      options.push({ value: b.id + '|' + c.id, label: `${b.name} · ${c.name}` });
    }));
  } else if (v === 'chapters') {
    state.books.forEach(b => options.push({ value: b.id, label: b.name }));
  }

  moveCtx = { kind, ids, from: { ...libState } };
  document.getElementById('move-title').textContent =
    kind === 'words' ? '移动单词到…' : kind === 'subs' ? '移动子章节到…' : '移动章节到…';
  document.getElementById('move-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">目标位置</label>
      <select class="form-select" id="mv-target">
        ${options.map(o => `<option value="${o.value}">${esc(o.label)}</option>`).join('')}
      </select>
    </div>
    <div class="lib-tip">共 ${ids.length} 项将被移动</div>
  `;
  openModal('move-modal');
}

function confirmMove() {
  if (!moveCtx) return;
  const target = document.getElementById('mv-target').value;
  const { kind, ids, from } = moveCtx;

  if (kind === 'words') {
    const [bId, cId, sId] = target.split('|');
    const dest = findSub(bId, cId, sId);
    const src = findSub(from.bookId, from.chapterId, from.subId);
    if (!dest || !src) { closeModal('move-modal'); return toast('目标位置不存在'); }
    const moving = src.words.filter(w => ids.includes(w.id));
    src.words = src.words.filter(w => !ids.includes(w.id));
    dest.words.push(...moving);
  } else if (kind === 'subs') {
    const [bId, cId] = target.split('|');
    const destC = findChapter(bId, cId);
    const srcC = findChapter(from.bookId, from.chapterId);
    if (!destC || !srcC) { closeModal('move-modal'); return toast('目标章节不存在'); }
    if (!Array.isArray(destC.subchapters)) destC.subchapters = [];
    const moving = (srcC.subchapters || []).filter(s => ids.includes(s.id));
    srcC.subchapters = (srcC.subchapters || []).filter(s => !ids.includes(s.id));
    destC.subchapters.push(...moving);
  } else if (kind === 'chapters') {
    const destB = findBook(target);
    const srcB = findBook(from.bookId);
    if (!destB || !srcB) { closeModal('move-modal'); return toast('目标词书不存在'); }
    const moving = srcB.chapters.filter(c => ids.includes(c.id));
    srcB.chapters = srcB.chapters.filter(c => !ids.includes(c.id));
    destB.chapters.push(...moving);
  }

  saveState();
  closeModal('move-modal');
  resetLibSelection();
  renderLibrary();
  renderHome();
  toast('移动完成');
  moveCtx = null;
}

function saveWordForm() {
  const zh = document.getElementById('ew-zh').value.trim();
  const py = document.getElementById('ew-py').value.trim();
  const th = document.getElementById('ew-th').value.trim();
  const example = document.getElementById('ew-example').value.trim();
  const image = document.getElementById('ew-image').value.trim();
  const audio = document.getElementById('ew-audio').value.trim();
  const video = document.getElementById('ew-video').value.trim();
  const syn = document.getElementById('ew-syn').value.trim();
  const ant = document.getElementById('ew-ant').value.trim();
  const near = document.getElementById('ew-near').value.trim();
  const targetBookId = document.getElementById('ew-book').value;
  const targetChapterId = document.getElementById('ew-chapter').value;
  const targetSubId = document.getElementById('ew-sub').value;

  if (!zh) return toast('请填写中文');
  if (!th) return toast('请填写泰语');
  const targetSub = findSub(targetBookId, targetChapterId, targetSubId);
  if (!targetSub) return toast('目标子章节不存在');

  if (editingWord.mode === 'new') {
    targetSub.words.push({
      id: uid(), zh, py, th, image, audio, video, example, syn, ant, near
    });
    toast('添加成功');
  } else {
    const w = findWord(editingWord.bookId, editingWord.chapterId, editingWord.subId, editingWord.wordId);
    if (!w) return toast('单词不存在');
    const newVals = { image, audio, video };
    ['image', 'audio', 'video'].forEach(k => {
      const oldVal = w[k];
      if (oldVal && oldVal.startsWith('media:') && oldVal !== newVals[k]) {
        const id = oldVal.slice(6);
        deleteMedia(id);
        if (_mediaUrlCache[id]) { try { URL.revokeObjectURL(_mediaUrlCache[id]); } catch(e){} delete _mediaUrlCache[id]; }
      }
    });
    w.zh = zh; w.py = py; w.th = th;
    w.image = image; w.audio = audio; w.video = video; w.example = example;
    w.syn = syn; w.ant = ant; w.near = near;

    if (targetSubId !== editingWord.subId ||
        targetChapterId !== editingWord.chapterId ||
        targetBookId !== editingWord.bookId) {
      const srcSub = findSub(editingWord.bookId, editingWord.chapterId, editingWord.subId);
      if (srcSub) srcSub.words = srcSub.words.filter(x => x.id !== w.id);
      targetSub.words.push(w);
    }
    toast('已保存');
  }

  saveState();
  closeModal('edit-word-modal');
  renderLibrary();
  renderHome();
}

function cleanupWordMedia(word) {
  if (!word) return;
  ['image', 'audio', 'video'].forEach(k => {

      deleteMedia(id);
      if (_mediaUrlCache[id]) { try { URL.revokeObjectURL(_mediaUrlCache[id]); } catch(e){} delete _mediaUrlCache[id]; }
    }
  });
}

async function handleFileUpload(type, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 100 * 1024 * 1024) {
    if (!confirm('文件超过 100MB，可能保存失败，是否继续？')) { input.value = ''; return; }
  }
  try {
    toast('正在保存文件…');
    const id = await saveMedia(file);
    const map = { image: 'ew-image', audio: 'ew-audio', video: 'ew-video' };
    const el = document.getElementById(map[type]);
    if (el) el.value = 'media:' + id;
    toast('已保存到本地存储');
  } catch (e) {
    console.error(e);
    toast('保存失败：' + e.message);
  }
  input.value = '';
}

function isThai(s) { return /[\u0E00-\u0E7F]/.test(s); }
function isPinyinLike(s) {
  return /^[a-zA-ZüÜāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜÄäÖöÜü\s\d'’\-·]+$/.test(s) && !isThai(s);
}

function parseBatchLine(line) {
  const raw = line.trim();
  if (!raw) return null;
  let parts = [];
  if (raw.includes('+')) parts = raw.split('+');
  else if (raw.includes('=')) parts = raw.split('=');
  else if (raw.includes('|')) parts = raw.split('|');
  else if (raw.includes('，')) parts = raw.split('，');
  else if (raw.includes(',')) parts = raw.split(',');
  else if (raw.includes('　')) parts = raw.split('　');
  else if (/\s+/.test(raw)) parts = raw.split(/\s+/);
  else return null;

  parts = parts.map(p => p.trim()).filter(Boolean);
  if (parts.length < 3) return null;

  let zh = '', th = '', py = '';
  const thIdx = parts.findIndex(p => isThai(p));
  if (thIdx >= 0) th = parts[thIdx];
  const pyIdx = parts.findIndex((p, i) => i !== thIdx && isPinyinLike(p));
  if (pyIdx >= 0) py = parts[pyIdx];
  const rest = parts.filter((p, i) => i !== thIdx && i !== pyIdx);
  zh = rest.join(' ');

  if (!zh && parts[0]) zh = parts[0];
  if (!th) th = parts[1] || '';
  if (!py) py = parts[2] || '';

  if (!zh || !th) return null;
  return { zh, th, py };
}

function saveBatchForm() {
  const text = document.getElementById('batch-input').value;
  const bookId = document.getElementById('batch-book').value;
  const chapterId = document.getElementById('batch-chapter').value;
  const subId = document.getElementById('batch-sub').value;
  const sub = findSub(bookId, chapterId, subId);
  if (!sub) return toast('目标子章节不存在');

  const lines = text.split('\n');
  let ok = 0, fail = 0;
  lines.forEach(line => {
    if (!line.trim()) return;
    const parsed = parseBatchLine(line);
    if (!parsed) { fail++; return; }
    sub.words.push({
      id: uid(),
      zh: parsed.zh, py: parsed.py, th: parsed.th,
      image: '', audio: '', video: '', example: '',
      syn: '', ant: '', near: ''
    });
    ok++;
  });

  if (ok === 0) return toast('没有解析到有效数据，请检查格式');
  saveState();
  closeModal('batch-modal');
  renderLibrary();
  renderHome();
  toast(`成功添加 ${ok} 个单词${fail ? '，' + fail + ' 行有误被跳过' : ''}`);
}
